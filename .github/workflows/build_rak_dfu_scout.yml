name: Build RAK4631 DFU Scout

on:
  push:
    branches:
      - esp-32-testing
    paths:
      - 'src/experimental/rak4631_dfu_scout.cpp'
      - 'tools/rak_dfu_serial_upload.py'
      - 'variants/nrf52840/rak4631/platformio.ini'
      - '.github/workflows/build_rak_dfu_scout.yml'
  workflow_dispatch:

permissions: read-all

concurrency:
  group: rak-dfu-scout-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    name: build-rak4631-dfu-scout
    steps:
      - name: Checkout ESP32 testing branch
        uses: actions/checkout@v7
        with:
          ref: esp-32-testing
          submodules: recursive

      - name: Install PlatformIO
        run: python -m pip install --upgrade platformio

      - name: Build RAK4631 DFU scout
        id: build
        shell: bash
        run: |
          set +e
          pio run -e rak4631_dfu_scout 2>&1 | tee rak-dfu-scout-build.log
          status=${PIPESTATUS[0]}
          echo "exit_code=$status" >> "$GITHUB_OUTPUT"
          exit "$status"

      - name: Prepare visible scout artifacts
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p export
          UF2="$(find .pio/build/rak4631_dfu_scout -maxdepth 1 -type f -name '*.uf2' | head -n 1)"
          OTA="$(find .pio/build/rak4631_dfu_scout -maxdepth 1 -type f -name '*-ota.zip' | head -n 1)"
          test -n "$UF2"
          cp "$UF2" export/RAK4631-DFU-Scout-Phase2-Serial-Bridge.uf2
          if [ -n "$OTA" ]; then cp "$OTA" export/RAK4631-DFU-Scout-Phase2-Serial-Bridge-OTA.zip; fi
          cp tools/rak_dfu_serial_upload.py export/rak_dfu_serial_upload.py

      - name: Upload DFU scout outputs and build log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: rak4631-dfu-scout-${{ github.run_number }}
          overwrite: true
          retention-days: 30
          if-no-files-found: warn
          path: |
            rak-dfu-scout-build.log
            export/*
