name: One-time repository branch cleanup

on:
  push:
    branches:
      - hobo-mx2001-mx2201-mx2203
    paths:
      - .github/workflows/repository_cleanup_once.yml

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Check out full repository history
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Preserve retired branches as immutable archive tags
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          create_tag() {
            local tag="$1"
            local sha="$2"
            local source="$3"
            if git ls-remote --exit-code --tags origin "refs/tags/${tag}" >/dev/null 2>&1; then
              echo "Tag ${tag} already exists; leaving it unchanged"
              return
            fi
            git tag -a "${tag}" "${sha}" -m "Archived branch ${source} before repository cleanup"
            git push origin "refs/tags/${tag}"
          }

          create_tag "archive/chatgpt-hobo-mesh-uf2-build-9a6ef9d" "9a6ef9d1f294e39e1acd54f9c2189372b4276e70" "chatgpt-hobo-mesh-uf2-build"
          create_tag "archive/chatgpt-rak4631-hobo-mesh-uf2-9cf2537" "9cf253703a1963153ed1ef1152268d386b61cb81" "chatgpt-rak4631-hobo-mesh-uf2"
          create_tag "archive/cca-mx-hobo-pir-seeed-v1-ci" "874336a3bc756d5299005a1cc7f9a4c4539851e0" "CCA-MX-HOBO-PIR-SEEED-v1-ci"
          create_tag "archive/hobo-mx2001-mx2201-mx2203-rak4631" "a582d273a5fa97e33015f05246524823810cb387" "hobo-mx2001-mx2201-mx2203-rak4631"
          create_tag "archive/hobo-universal-validated-2026-08-19" "6c46b97fc82c042a9c8ce3d7b0eac7cd9b67f054" "hobo-universal-validated-2026-08-19"
          create_tag "archive/hobo-universal-test" "45e96fca7da1b6d060b72cc8bc0eee3b838922ad" "hobo-universal-test"
          create_tag "archive/hobo-mx2001" "531fc38b28700a12a3980975331d61fb8baf813a" "hobo-mx2001"
          create_tag "archive/hobo-mx2201" "6f67afe27cb63e8779dcee9982f8703eedd2c335" "hobo-mx2201"
          create_tag "archive/hobo-mx2203" "b2257c3c992d585cb3b04b65ade9e10177af99ea" "hobo-mx2203"
          create_tag "archive/hobo-mx2201-mx2001" "e78f3218ee9a27f161af6d67669b8c04ab9cfe65" "hobo-mx2201-mx2001"
          create_tag "archive/mx2001-integration" "f88fa33f5a8ed0fb46c6148a574f9c3b9d196044" "mx2001-integration"
          create_tag "archive/mx2201-integration" "fe2b576c0ff93b2df314692682c56b174fa5e3ea" "mx2201-integration"
          create_tag "archive/mx2201-newread-test" "17e37c42ee7046ff59f6100b40df31ff38956ede" "mx2201-newread-test"
          create_tag "archive/mx2203-discovery-test" "27f98ca4ab9b2901e41b1e6a0996c0a637d7516d" "mx2203-discovery-test"
          create_tag "archive/rak4631-mx2201-raw-debug" "b75917f92154c25e870a6020f0e7c6c8cf03d1c0" "rak4631-mx2201-raw-debug"
          create_tag "archive/heltec-home-http-gateway" "51202989f53394ea8c52a3dbe5ca69072d07f3e4" "heltec-home-http-gateway"
          create_tag "archive/heltec-home-http-gateway-hidden-valley" "38af79d01ed3b42065bcf9f2ce37f2c565e47fda" "heltec-home-http-gateway-hidden-valley"
          create_tag "archive/heltec-home-http-gateway-rock" "38af79d01ed3b42065bcf9f2ce37f2c565e47fda" "heltec-home-http-gateway-rock"

      - name: Delete retired remote branches
        shell: bash
        run: |
          set -euo pipefail

          delete_branch() {
            local branch="$1"
            if git ls-remote --exit-code --heads origin "refs/heads/${branch}" >/dev/null 2>&1; then
              echo "Deleting ${branch}"
              git push origin --delete "${branch}"
            else
              echo "${branch} already absent"
            fi
          }

          delete_branch "chatgpt-hobo-mesh-uf2-build"
          delete_branch "chatgpt-rak4631-hobo-mesh-uf2"
          delete_branch "CCA-MX-HOBO-PIR-SEEED-v1-ci"
          delete_branch "hobo-mx2001-mx2201-mx2203-rak4631"
          delete_branch "hobo-universal-validated-2026-08-19"
          delete_branch "hobo-universal-test"
          delete_branch "hobo-mx2001"
          delete_branch "hobo-mx2201"
          delete_branch "hobo-mx2203"
          delete_branch "hobo-mx2201-mx2001"
          delete_branch "mx2001-integration"
          delete_branch "mx2201-integration"
          delete_branch "mx2201-newread-test"
          delete_branch "mx2203-discovery-test"
          delete_branch "rak4631-mx2201-raw-debug"
          delete_branch "heltec-home-http-gateway"
          delete_branch "heltec-home-http-gateway-hidden-valley"
          delete_branch "heltec-home-http-gateway-rock"

      - name: Record archive map and remove this one-time workflow
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p docs
          cat > docs/ARCHIVED_BRANCHES.md <<'EOF'
          # Archived Branches

          Retired development branches were preserved as immutable Git tags before branch cleanup. These tags are historical recovery points, not current deployment targets.

          | Retired branch | Archive tag |
          |---|---|
          | `chatgpt-hobo-mesh-uf2-build` | `archive/chatgpt-hobo-mesh-uf2-build-9a6ef9d` |
          | `chatgpt-rak4631-hobo-mesh-uf2` | `archive/chatgpt-rak4631-hobo-mesh-uf2-9cf2537` |
          | `CCA-MX-HOBO-PIR-SEEED-v1-ci` | `archive/cca-mx-hobo-pir-seeed-v1-ci` |
          | `hobo-mx2001-mx2201-mx2203-rak4631` | `archive/hobo-mx2001-mx2201-mx2203-rak4631` |
          | `hobo-universal-validated-2026-08-19` | `archive/hobo-universal-validated-2026-08-19` |
          | `hobo-universal-test` | `archive/hobo-universal-test` |
          | `hobo-mx2001` | `archive/hobo-mx2001` |
          | `hobo-mx2201` | `archive/hobo-mx2201` |
          | `hobo-mx2203` | `archive/hobo-mx2203` |
          | `hobo-mx2201-mx2001` | `archive/hobo-mx2201-mx2001` |
          | `mx2001-integration` | `archive/mx2001-integration` |
          | `mx2201-integration` | `archive/mx2201-integration` |
          | `mx2201-newread-test` | `archive/mx2201-newread-test` |
          | `mx2203-discovery-test` | `archive/mx2203-discovery-test` |
          | `rak4631-mx2201-raw-debug` | `archive/rak4631-mx2201-raw-debug` |
          | `heltec-home-http-gateway` | `archive/heltec-home-http-gateway` |
          | `heltec-home-http-gateway-hidden-valley` | `archive/heltec-home-http-gateway-hidden-valley` |
          | `heltec-home-http-gateway-rock` | `archive/heltec-home-http-gateway-rock` |

          ## Active branches after cleanup

          - `hobo-mx2001-mx2201-mx2203` — canonical universal HOBO field-node firmware
          - `cca-heltec-sensor-gateway` — canonical production Heltec gateway
          - `CCA-MX-HOBO-PIR-SEEED-v1` — HOBO + PIR field variant
          - `CCA-MX-HOBO-PIR-ROCK-SEEED-v1` — HOBO + PIR + rock/soil field variant
          - `fucking-around` — experimental ultrasonic/water field-node work
          - `fucking-around-heltec` — paired experimental water-alert gateway
          - `trail-sen0171` — dedicated trail-counter experiment

          The canonical HOBO production branch supports RAK4631 and Seeed targets; the retired `hobo-mx2001-mx2201-mx2203-rak4631` branch must not be used as a production shortcut.
          EOF

          git rm .github/workflows/repository_cleanup_once.yml
          git add docs/ARCHIVED_BRANCHES.md
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Record archived branches after repository cleanup"
          git push origin HEAD:hobo-mx2001-mx2201-mx2203
