name: Fix Heltec WiFi BLE coexistence once

on:
  push:
    branches:
      - cca-heltec-sensor-gateway
    paths:
      - '.github/workflows/fix_hobo_wifi_ble_coexist_once.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cca-heltec-sensor-gateway
          fetch-depth: 0

      - name: Patch Heltec BLE ownership and coexistence
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          platform = Path('src/platform/esp32/main-esp32.cpp')
          text = platform.read_text()
          old = '''#elif HAS_WIFI
              if (!isWifiAvailable() && config.bluetooth.enabled == true)
          #else
              if (config.bluetooth.enabled == true)
          #endif
          '''
          new = '''#elif HAS_WIFI
          #if defined(HELTEC_V4)
              // CCA Heltec sensor gateway needs one shared NimBLE stack for both
              // the Meshtastic phone service and direct HOBO BLE central/client work.
              // ESP32-S3 hardware supports WiFi/BLE coexistence; start BLE before WiFi
              // instead of suppressing BLE whenever WiFi is configured.
              if (config.bluetooth.enabled == true)
          #else
              if (!isWifiAvailable() && config.bluetooth.enabled == true)
          #endif
          #else
              if (config.bluetooth.enabled == true)
          #endif
          '''
          if old not in text:
              raise SystemExit('Expected ESP32 WiFi/BLE gate not found; refusing blind patch')
          platform.write_text(text.replace(old, new, 1))

          hobo = Path('src/modules/HoboBleSensorModule.cpp')
          text = hobo.read_text()
          old = '''    if (!initialized) {
          #ifdef NIMBLE_TWO
                  const bool nimbleReady = NimBLEDevice::isInitialized();
          #else
                  const bool nimbleReady = NimBLEDevice::getInitialized();
          #endif
                  if (!nimbleReady) {
                      LOG_INFO("CCA HOBO: NimBLE not initialized by Meshtastic; initializing BLE central");
                      NimBLEDevice::init("");
                  } else if (!nimbleBluetooth || !nimbleBluetooth->isActive()) {
                      LOG_INFO("CCA HOBO: Meshtastic phone BLE inactive; continuing with BLE central");
                  }
                  initializeClient();
                  return 250;
              }
          '''
          new = '''    if (!initialized) {
                  if (!nimbleBluetooth || !nimbleBluetooth->isActive()) {
                      static bool waitLogged = false;
                      if (!waitLogged) {
                          LOG_INFO("CCA HOBO: waiting for Meshtastic NimBLE stack");
                          waitLogged = true;
                      }
                      return 500;
                  }
                  LOG_INFO("CCA HOBO: using Meshtastic NimBLE stack for direct HOBO central");
                  initializeClient();
                  return 250;
              }
          '''
          if old not in text:
              raise SystemExit('Expected HOBO startup block not found; refusing blind patch')
          hobo.write_text(text.replace(old, new, 1))
          PY

      - name: Commit coexistence fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/platform/esp32/main-esp32.cpp src/modules/HoboBleSensorModule.cpp
          git commit -m "Enable shared WiFi BLE stack for Heltec HOBO gateway"
          git push origin HEAD:cca-heltec-sensor-gateway
