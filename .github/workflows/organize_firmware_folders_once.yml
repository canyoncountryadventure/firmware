name: One-Time Firmware Folder Organization

on:
  push:
    branches:
      - field-self-recovery
    paths:
      - '.github/workflows/organize_firmware_folders_once.yml'

permissions:
  contents: write
  actions: read

jobs:
  organize:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout default branch
        uses: actions/checkout@v7
        with:
          ref: field-self-recovery
          fetch-depth: 1

      - name: Build the two-folder firmware library
        shell: bash
        run: |
          set -euo pipefail

          # User-facing production library. The rest of the repository is build/source infrastructure.
          mkdir -p \
            Self-Recovery-v1s/Seeed-HOBO-Safe-v1 \
            Self-Recovery-v1s/RAK-HOBO-Safe-v1 \
            Self-Recovery-v1s/Heltec-Gateway-v1 \
            Self-Recovery-v1s/Seeed-Water-Distance-v1 \
            Self-Recovery-v1s/RAK-Water-Distance-v1 \
            Self-Recovery-v1s/Seeed-Water-Distance-HOBO-v1 \
            Self-Recovery-v1s/RAK-Water-Distance-HOBO-v1 \
            Trail-Sensors/SEN0171 \
            Trail-Sensors/PIR-Rock-HOBO

          copy_required() {
            src="$1"
            dst="$2"
            test -f "$src" || { echo "Missing required source: $src"; exit 1; }
            cp "$src" "$dst"
          }

          copy_required downloads/Seeed-HOBO-Safe-v1.uf2 Self-Recovery-v1s/Seeed-HOBO-Safe-v1/Seeed-HOBO-Safe-v1.uf2
          copy_required downloads/Seeed-HOBO-Safe-v1-OTA.zip Self-Recovery-v1s/Seeed-HOBO-Safe-v1/Seeed-HOBO-Safe-v1-OTA.zip
          copy_required downloads/RAK-HOBO-Safe-v1.uf2 Self-Recovery-v1s/RAK-HOBO-Safe-v1/RAK-HOBO-Safe-v1.uf2
          copy_required downloads/RAK-HOBO-Safe-v1-OTA.zip Self-Recovery-v1s/RAK-HOBO-Safe-v1/RAK-HOBO-Safe-v1-OTA.zip
          copy_required downloads/Heltec-Gateway-v1.zip Self-Recovery-v1s/Heltec-Gateway-v1/Heltec-Gateway-v1.zip
          copy_required downloads/Seeed-Water-Distance-v1.uf2 Self-Recovery-v1s/Seeed-Water-Distance-v1/Seeed-Water-Distance-v1.uf2
          copy_required downloads/Seeed-Water-Distance-v1-OTA.zip Self-Recovery-v1s/Seeed-Water-Distance-v1/Seeed-Water-Distance-v1-OTA.zip
          copy_required downloads/RAK-Water-Distance-v1.uf2 Self-Recovery-v1s/RAK-Water-Distance-v1/RAK-Water-Distance-v1.uf2
          copy_required downloads/RAK-Water-Distance-v1-OTA.zip Self-Recovery-v1s/RAK-Water-Distance-v1/RAK-Water-Distance-v1-OTA.zip
          copy_required downloads/Seeed-Water-Distance-HOBO-v1.uf2 Self-Recovery-v1s/Seeed-Water-Distance-HOBO-v1/Seeed-Water-Distance-HOBO-v1.uf2
          copy_required downloads/Seeed-Water-Distance-HOBO-v1-OTA.zip Self-Recovery-v1s/Seeed-Water-Distance-HOBO-v1/Seeed-Water-Distance-HOBO-v1-OTA.zip
          copy_required downloads/RAK-Water-Distance-HOBO-v1.uf2 Self-Recovery-v1s/RAK-Water-Distance-HOBO-v1/RAK-Water-Distance-HOBO-v1.uf2
          copy_required downloads/RAK-Water-Distance-HOBO-v1-OTA.zip Self-Recovery-v1s/RAK-Water-Distance-HOBO-v1/RAK-Water-Distance-HOBO-v1-OTA.zip

          # Permanently copy the validated Trail-Sensors build products out of Actions artifacts.
          rm -rf /tmp/sen0171 /tmp/pirrock /tmp/pirrock-safe
          mkdir -p /tmp/sen0171 /tmp/pirrock /tmp/pirrock-safe
          gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/10380585886/zip" > /tmp/sen0171.zip
          gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/10380436773/zip" > /tmp/pirrock.zip
          gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/10380297699/zip" > /tmp/pirrock-safe.zip
          unzip -q /tmp/sen0171.zip -d /tmp/sen0171
          unzip -q /tmp/pirrock.zip -d /tmp/pirrock
          unzip -q /tmp/pirrock-safe.zip -d /tmp/pirrock-safe

          SEN_UF2="$(find /tmp/sen0171 -type f -name '*.uf2' ! -iname '*factory*' | head -n 1)"
          SEN_OTA="$(find /tmp/sen0171 -type f -name '*-ota.zip' | head -n 1)"
          PIR_UF2="$(find /tmp/pirrock -type f -name '*.uf2' ! -iname '*factory*' | head -n 1)"
          PIR_OTA="$(find /tmp/pirrock-safe -type f -name '*.zip' | head -n 1)"

          test -n "$SEN_UF2" && test -f "$SEN_UF2"
          test -n "$SEN_OTA" && test -f "$SEN_OTA"
          test -n "$PIR_UF2" && test -f "$PIR_UF2"
          test -n "$PIR_OTA" && test -f "$PIR_OTA"

          cp "$SEN_UF2" Trail-Sensors/SEN0171/Trail-SEN0171-v1.uf2
          cp "$SEN_OTA" Trail-Sensors/SEN0171/Trail-SEN0171-v1-OTA.zip
          cp "$PIR_UF2" Trail-Sensors/PIR-Rock-HOBO/Trail-PIR-Rock-HOBO-v1.uf2
          cp "$PIR_OTA" Trail-Sensors/PIR-Rock-HOBO/Trail-PIR-Rock-HOBO-v1-OTA.zip

          cat > Self-Recovery-v1s/README.md <<'EOF'
          # Self Recovery v1 Firmware

          Open the folder for the hardware/application you want, then download the UF2 or OTA ZIP inside it.

          - Seeed-HOBO-Safe-v1
          - RAK-HOBO-Safe-v1
          - Heltec-Gateway-v1
          - Seeed-Water-Distance-v1
          - RAK-Water-Distance-v1
          - Seeed-Water-Distance-HOBO-v1
          - RAK-Water-Distance-HOBO-v1

          For nRF52840 boards, UF2 is the normal USB drag-and-drop image and OTA ZIP is the BLE DFU image. Do not use factory-erase firmware for routine upgrades.
          EOF

          cat > Trail-Sensors/README.md <<'EOF'
          # Trail Sensors

          This folder contains the consolidated trail-sensor firmware builds.

          - `SEN0171/` — dedicated SEN0171 trail counter.
          - `PIR-Rock-HOBO/` — PIR + rock telemetry + HOBO build.

          Each subfolder contains a normal UF2 and OTA ZIP.
          EOF

          cat > Self-Recovery-v1s/Seeed-Water-Distance-HOBO-v1/README.md <<'EOF'
          # Seeed Water Distance + HOBO v1

          Board: Seeed XIAO nRF52840 + Wio-SX1262.

          This is the combined production build: Water Distance v1 plus HOBO MX BLE telemetry and the HOBO self-recovery/watchdog supervisor. The water A/B persistent calibration fix is retained.

          - `Seeed-Water-Distance-HOBO-v1.uf2` — normal USB drag-and-drop update.
          - `Seeed-Water-Distance-HOBO-v1-OTA.zip` — BLE DFU / OTA update.
          EOF

          for dir in \
            Self-Recovery-v1s/Seeed-HOBO-Safe-v1 \
            Self-Recovery-v1s/RAK-HOBO-Safe-v1 \
            Self-Recovery-v1s/Heltec-Gateway-v1 \
            Self-Recovery-v1s/Seeed-Water-Distance-v1 \
            Self-Recovery-v1s/RAK-Water-Distance-v1 \
            Self-Recovery-v1s/RAK-Water-Distance-HOBO-v1; do
            if [[ ! -f "$dir/README.md" ]]; then
              name="$(basename "$dir")"
              printf '# %s\n\nProduction firmware files for `%s`.\n' "$name" "$name" > "$dir/README.md"
            fi
          done

          cat > Trail-Sensors/SEN0171/README.md <<'EOF'
          # SEN0171 Trail Counter

          Dedicated Seeed XIAO nRF52840 + Wio-SX1262 SEN0171 trail-counter firmware.

          The build was compile-validated in the consolidated Trail-Sensors workflow before the old standalone branch was removed.
          EOF

          cat > Trail-Sensors/PIR-Rock-HOBO/README.md <<'EOF'
          # PIR + Rock + HOBO Trail Sensor

          Consolidated Seeed XIAO nRF52840 + Wio-SX1262 build containing the PIR, rock telemetry, and HOBO functionality preserved from the former standalone trail branches.

          The build and settings-safe OTA package were validated before the old standalone branches were removed.
          EOF

      - name: Commit organized firmware library
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Self-Recovery-v1s Trail-Sensors
          if git diff --cached --quiet; then
            echo "No folder changes to commit"
            exit 0
          fi
          git commit -m "Organize firmware into Self-Recovery and Trail folders"
          git push origin HEAD:field-self-recovery
