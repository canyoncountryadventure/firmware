name: Build HOBO Self-Recovery Seeed

on:
  push:
    branches:
      - hobo-self-recovery-seeed
  workflow_dispatch:

permissions: read-all

jobs:
  build-seeed-self-recovery:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Seeed self-recovery branch
        uses: actions/checkout@v7
        with:
          ref: hobo-self-recovery-seeed
          submodules: recursive

      - name: Build Seeed XIAO nRF52840 Kit
        uses: meshtastic/gh-action-firmware@main
        with:
          pio_platform: nrf52840
          pio_env: seeed_xiao_nrf52840_kit
          pio_target: build

      - name: Upload Seeed self-recovery artifact
        uses: actions/upload-artifact@v7
        with:
          name: hobo-self-recovery-seeed-${{ github.run_number }}
          overwrite: true
          retention-days: 30
          path: |
            release/*.uf2
            release/*.zip
            release/*.bin
            release/*.elf
            release/*.map
            release/*.mt.json
