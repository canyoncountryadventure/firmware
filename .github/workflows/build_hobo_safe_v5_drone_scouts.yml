name: Build verified HOBO Safe V5.1 drone Scouts

on:
  push:
    branches: [Remote-Drone-Flashing-v2]
    paths:
      - '.github/workflows/build_hobo_safe_v5_drone_scouts.yml'
      - 'tools/build_drone_embedded_firmware.py'
      - 'tools/verify_drone_hobo_safe_v5.py'
      - 'src/experimental/rak4631_drone_flasher.cpp'
      - 'variants/nrf52840/rak4631/platformio.ini'
      - 'README.md'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: hobo-safe-v5-drone-scouts
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Seeed-HOBO-Safe-v5
            target_branch: Seeed-HOBO-Safe-v5
            target_env: seeed_xiao_nrf52840_kit
            target_sha: 45281362e082f2a05d178364b1b035a11cc29c44
            target_catalog_sha: 29e832d1f9f79941e21c79a6ee6686a7715a6b49
            target_release_date: 2026-11-04
            ota_sha256: 5003cee9ddcb01618a8f61a8888d996250538ce3951996dde1bbd396ec085c1d
            output_name: Drone-Seeed-HOBO-Safe-v5-2026-11-05.uf2
          - name: RAK-HOBO-Safe-v5
            target_branch: RAK-HOBO-Safe-v5
            target_env: rak4631
            target_sha: b9862cd15fcb090174564dc803aa71d9f24e2186
            target_catalog_sha: 29e832d1f9f79941e21c79a6ee6686a7715a6b49
            target_release_date: 2026-11-05
            ota_sha256: a140e1b4a1f63244d66ff0ddce652afda7a7a78a872bc8d58596aeb505c7564d
            output_name: Drone-RAK-HOBO-Safe-v5-2026-11-05.uf2
    steps:
      - name: Checkout proven RAK4631 Scout implementation
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: Remote-Drone-Flashing-v2
          submodules: recursive

      - name: Install build and compressor tools
        run: python -m pip install platformio lz4

      - name: Download pinned V5.1 target and verify SHA-256
        shell: bash
        env:
          OTA_HASH: ${{ matrix.ota_sha256 }}
          TARGET_NAME: ${{ matrix.name }}
          TARGET_CATALOG_SHA: ${{ matrix.target_catalog_sha }}
          TARGET_RELEASE_DATE: ${{ matrix.target_release_date }}
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 \
            "https://raw.githubusercontent.com/canyoncountryadventure/firmware/$TARGET_CATALOG_SHA/downloads/${TARGET_NAME}-$TARGET_RELEASE_DATE-OTA.zip" \
            --output target-ota.zip
          printf '%s  target-ota.zip\n' "$OTA_HASH" | sha256sum --check
          python tools/build_drone_embedded_firmware.py target-ota.zip src/experimental/embedded_dfu_image.h

      - name: Build RAK4631 autonomous drone Scout with V5.1 embedded
        shell: bash
        run: |
          set -euo pipefail
          pio run -e rak4631_drone_flasher

      - name: Verify exact V5.1 image and produce drone UF2
        shell: bash
        env:
          OUTPUT_NAME: ${{ matrix.output_name }}
          TARGET_NAME: ${{ matrix.name }}
          TARGET_BRANCH: ${{ matrix.target_branch }}
          TARGET_ENV: ${{ matrix.target_env }}
          TARGET_SHA: ${{ matrix.target_sha }}
          TARGET_CATALOG_SHA: ${{ matrix.target_catalog_sha }}
          TARGET_RELEASE_DATE: ${{ matrix.target_release_date }}
          OTA_HASH: ${{ matrix.ota_sha256 }}
        run: |
          set -euo pipefail
          SCOUT="$(find .pio/build/rak4631_drone_flasher -maxdepth 1 -type f -name 'firmware-*.uf2' | sort | head -n 1)"
          test -f "$SCOUT"
          mkdir -p export
          cp "$SCOUT" "export/$OUTPUT_NAME"
          python tools/verify_drone_hobo_safe_v5.py "export/$OUTPUT_NAME" target-ota.zip src/experimental/embedded_dfu_image.h
          {
            echo "Scout flasher: $OUTPUT_NAME"
            echo "Scout board: RAK4631"
            echo "Embedded target: $TARGET_NAME"
            echo "Target branch: $TARGET_BRANCH"
            echo "Target source commit: $TARGET_SHA"
            echo "Target environment: $TARGET_ENV"
            echo "Target OTA ZIP SHA-256: $OTA_HASH"
            echo "Target catalog commit: $TARGET_CATALOG_SHA"
            echo "Target OTA release date: $TARGET_RELEASE_DATE"
            echo "Drone source branch: Remote-Drone-Flashing-v2"
            echo "Drone source commit: $GITHUB_SHA"
            echo "Verified: nRF52840 UF2 + exact LZ4 application + Nordic init packet"
            echo "Scout UF2 bytes: $(stat -c%s "export/$OUTPUT_NAME")"
            sha256sum "export/$OUTPUT_NAME"
          } > "export/$OUTPUT_NAME.txt"

      - name: Upload verified V5.1 Scout build
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: hobo-safe-v5.1-drone-${{ matrix.name }}
          path: export/*
          retention-days: 90
          overwrite: true

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download both matched V5.1 Scout images
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: hobo-safe-v5.1-drone-*
          merge-multiple: true
          path: built

      - name: Checkout drone catalog
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: Remote-Drone-Flashing-v2
          path: publish
          fetch-depth: 0

      - name: Publish dated Seeed and RAK V5.1 Scout files
        shell: bash
        run: |
          set -euo pipefail
          cd publish
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3 4 5; do
            git fetch origin Remote-Drone-Flashing-v2
            git reset --hard origin/Remote-Drone-Flashing-v2
            latest="$(git rev-parse HEAD)"
            if [ "$latest" != "$GITHUB_SHA" ]; then
              echo "Skipping stale V5.1 Scout publication: run=$GITHUB_SHA latest=$latest"
              exit 0
            fi
            mkdir -p downloads
            cp ../built/Drone-Seeed-HOBO-Safe-v5-2026-11-05.uf2 downloads/
            cp ../built/Drone-Seeed-HOBO-Safe-v5-2026-11-05.uf2.txt downloads/
            cp ../built/Drone-RAK-HOBO-Safe-v5-2026-11-05.uf2 downloads/
            cp ../built/Drone-RAK-HOBO-Safe-v5-2026-11-05.uf2.txt downloads/
            git add downloads/Drone-Seeed-HOBO-Safe-v5-2026-11-05.uf2*
            git add downloads/Drone-RAK-HOBO-Safe-v5-2026-11-05.uf2*
            if git diff --cached --quiet; then exit 0; fi
            git commit -m "Publish dated V5.1 Seeed and RAK HOBO Scouts"
            if git push origin HEAD:Remote-Drone-Flashing-v2; then exit 0; fi
            sleep $((attempt * 3))
          done
          echo "Could not publish matching V5.1 Scouts" >&2
          exit 1
