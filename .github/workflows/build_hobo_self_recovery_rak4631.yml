name: Build HOBO Self-Recovery RAK4631

on:
  push:
    branches:
      - hobo-self-recovery-rak4631
  workflow_dispatch:

permissions: read-all

jobs:
  build-rak-self-recovery:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout RAK self-recovery branch
        uses: actions/checkout@v7
        with:
          ref: hobo-self-recovery-rak4631
          submodules: recursive

      - name: Build RAK4631
        uses: meshtastic/gh-action-firmware@main
        with:
          pio_platform: nrf52840
          pio_env: rak4631
          pio_target: build

      - name: Upload RAK self-recovery artifact
        uses: actions/upload-artifact@v7
        with:
          name: hobo-self-recovery-rak4631-${{ github.run_number }}
          overwrite: true
          retention-days: 30
          path: |
            release/*.uf2
            release/*.bin
            release/*.elf
            release/*.map
            release/*.mt.json
