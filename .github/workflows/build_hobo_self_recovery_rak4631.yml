name: Build RAK HOBO Safe v2
# Canonical hardened RAK/HOBO v2 product build.

on:
  push:
    branches:
      - RAK-HOBO-Safe-v2
  workflow_dispatch:

concurrency:
  group: RAK-HOBO-Safe-v2
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build-rak-hobo-safe:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout RAK HOBO Safe v2 branch
        uses: actions/checkout@v7
        with:
          ref: RAK-HOBO-Safe-v2
          submodules: recursive

      - name: Build RAK4631
        uses: meshtastic/gh-action-firmware@39d0ffe8e0708beb3fb7b66f4c91aa941dc9764e
        with:
          pio_platform: nrf52840
          pio_env: rak4631
          pio_target: build

      - name: Upload firmware artifacts
        uses: actions/upload-artifact@v7
        with:
          name: RAK-HOBO-Safe-v2-${{ github.run_number }}
          overwrite: true
          retention-days: 30
          path: |
            release/*.uf2
            release/*.zip
            release/*.bin
            release/*.elf
            release/*.map
            release/*.mt.json
            drone-out/*.uf2

      - name: Prepare permanent downloads
        shell: bash
        run: |
          set -euo pipefail
          UF2="$(find release -maxdepth 1 -type f -name 'firmware-rak4631-*.uf2' | head -n 1)"
          OTA="$(find release -maxdepth 1 -type f -name 'firmware-rak4631-*-ota.zip' | head -n 1)"
          test -n "$UF2"
          test -n "$OTA"
          SCOUT="drone-out/scout.uf2"
          mkdir -p export
          cp "$UF2" export/RAK-HOBO-Safe-v2.uf2
          cp "$OTA" export/RAK-HOBO-Safe-v2-OTA.zip

      - name: Checkout firmware download branch
        uses: actions/checkout@v7
        with:
          ref: field-self-recovery
          path: publish
          fetch-depth: 0

      - name: Publish permanent downloads
        shell: bash
        run: |
          set -euo pipefail
          cd publish
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          latest_source_sha="$(git ls-remote origin refs/heads/RAK-HOBO-Safe-v2 | awk '{print $1}')"
          if [[ "$latest_source_sha" != "$GITHUB_SHA" ]]; then
            echo "Skipping stale publish: run=$GITHUB_SHA latest=$latest_source_sha"
            exit 0
          fi
          for attempt in 1 2 3 4 5; do
            git fetch origin field-self-recovery
            git reset --hard origin/field-self-recovery
            mkdir -p downloads
            cp ../export/RAK-HOBO-Safe-v2.uf2 downloads/
            cp ../export/RAK-HOBO-Safe-v2-OTA.zip downloads/
            if git diff --cached --quiet; then
              echo "Downloads already current"
              exit 0
            fi
            git commit -m "Publish RAK HOBO Safe v2 downloads"
            if git push origin HEAD:field-self-recovery; then
              exit 0
            fi
            sleep $((attempt * 3))
          done
          echo "Failed to publish downloads after retries" >&2
          exit 1
