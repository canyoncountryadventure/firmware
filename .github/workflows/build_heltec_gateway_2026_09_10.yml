name: Build Heltec Gateway 2026-09-10

on:
  push:
    branches:
      - heltec-gateway-2026-09-10
    paths:
      - '.github/workflows/build_heltec_gateway_2026_09_10.yml'
      - 'src/**'
      - 'variants/**'
      - 'arch/**'
      - 'platformio.ini'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-heltec-v4:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: heltec-gateway-2026-09-10
          fetch-depth: 0
          submodules: recursive

      - name: Apply production gateway fixes
        shell: python
        run: |
          from pathlib import Path
          import re

          # 1) Make permanent remote environment/device routing explicit and
          #    wake the gateway worker whenever the held queue receives data.
          p = Path('src/modules/HoboHttpGatewayModule.cpp')
          s = p.read_text()
          marker = 'if (!uploadQueue.enqueue(job, 0)) {\n        LOG_WARN("CCA sensor gateway: hold queue full'
          if s.count(marker) == 2:
              s = s.replace(marker, 'if (!enqueueHeld(job, 0)) {\n        LOG_WARN("CCA sensor gateway: hold queue full')

          # The held queue previously had no reader attached. TypedQueue only
          # wakes a worker when its own reader is set, so the five-minute
          # fallback could remain asleep indefinitely when only remote packets
          # arrived. Attach the same gateway worker to both queues.
          old_reader = '    uploadQueue.setReader(this);\n    setInterval(5000);'
          new_reader = '    uploadQueue.setReader(this);\n    pendingLocalEnvironmentQueue.setReader(this);\n    setInterval(5000);'
          if old_reader in s:
              s = s.replace(old_reader, new_reader, 1)
          elif 'pendingLocalEnvironmentQueue.setReader(this);' not in s:
              raise SystemExit('held queue reader patch target not found')

          # Also explicitly wake the worker after every successful held enqueue.
          old_held = '''    if (heldQueueStartedMs == 0)\n        heldQueueStartedMs = millis();\n    return true;'''
          new_held = '''    if (heldQueueStartedMs == 0)\n        heldQueueStartedMs = millis();\n    setIntervalFromNow(0);\n    return true;'''
          if old_held in s:
              s = s.replace(old_held, new_held, 1)
          elif 'setIntervalFromNow(0);' not in s[s.find('bool HoboHttpGatewayModule::enqueueHeld'):s.find('bool HoboHttpGatewayModule::queueLocalEnvironment')]:
              raise SystemExit('held queue wake patch target not found')
          p.write_text(s)

          # 2) Never allow failed HOBO STATUS/pointer polling to pause Home uploads.
          p = Path('src/modules/HoboBleSensorModule.cpp')
          s = p.read_text()
          s = s.replace(
              'LOG_WARN("CCA HOBO: STATUS unavailable; automatic TX PAUSED");',
              'LOG_WARN("CCA HOBO: STATUS unavailable; using interval-timed direct-read fallback");')
          s = s.replace(
              'LOG_WARN("CCA HOBO: pointer tracking unavailable; automatic TX PAUSED");',
              'LOG_WARN("CCA HOBO: pointer tracking unavailable; using interval-timed direct-read fallback");')

          ready_pattern = re.compile(
              r'    case HoboState::READY:\s*\n'
              r'        if \(!readRequestPending && \(nextStatusCheckMs == 0 \|\| reached\(now, nextStatusCheckMs\)\)\) \{\s*\n'
              r'            state = HoboState::SEND_STATUS;\s*\n'
              r'            stateDueMs = now;\s*\n'
              r'        \}\s*\n'
              r'        break;')
          new_ready = '''    case HoboState::READY:\n        if (!readRequestPending && (nextStatusCheckMs == 0 || reached(now, nextStatusCheckMs))) {\n            if (!statusTrackingAvailable) {\n                // Degraded mode: still read and publish on the HOBO detected logging cadence.\n                readPurpose = ReadPurpose::AUTOMATIC;\n                pendingWritePointer = lastWritePointer + 1;\n                pendingPointerDetectedMs = now;\n                state = HoboState::SEND_READ;\n                stateDueMs = now;\n                const uint32_t cadenceMs = loggerIntervalSeconds\n                    ? static_cast<uint32_t>(loggerIntervalSeconds) * 1000UL\n                    : 60000UL;\n                nextStatusCheckMs = now + cadenceMs;\n                LOG_INFO("CCA HOBO AUTO fallback read interval=%u sec",\n                         loggerIntervalSeconds ? loggerIntervalSeconds : 60);\n            } else {\n                state = HoboState::SEND_STATUS;\n                stateDueMs = now;\n            }\n        }\n        break;'''
          s, changed = ready_pattern.subn(new_ready, s, count=1)
          if changed != 1 and 'CCA HOBO AUTO fallback read interval=' not in s:
              raise SystemExit(f'READY state patch failed, replacements={changed}')

          # In degraded mode, an automatic read must publish even though no fresh pointer was available.
          old_gate = '''            if (readPurpose == ReadPurpose::AUTOMATIC) {\n                if (!haveStatusBaseline || pendingWritePointer == lastWritePointer) {\n                    nextStatusCheckMs = now + POINTER_FINE_POLL_MS;\n                    state = HoboState::READY;\n                    break;\n                }'''
          new_gate = '''            if (readPurpose == ReadPurpose::AUTOMATIC) {\n                if (statusTrackingAvailable && (!haveStatusBaseline || pendingWritePointer == lastWritePointer)) {\n                    nextStatusCheckMs = now + POINTER_FINE_POLL_MS;\n                    state = HoboState::READY;\n                    break;\n                }'''
          if old_gate in s:
              s = s.replace(old_gate, new_gate, 1)
          elif 'statusTrackingAvailable && (!haveStatusBaseline || pendingWritePointer == lastWritePointer)' not in s:
              raise SystemExit('automatic publish gate patch target not found')
          p.write_text(s)

          # 3) Wire the recovered A02YYUW WATER_ALERT receiver into the Heltec module set.
          p = Path('src/modules/Modules.cpp')
          s = p.read_text()
          inc = '#include "modules/WaterAlertGatewayModule.h"\n'
          anchor = '#include "modules/HoboHttpGatewayModule.h"\n'
          if inc not in s:
              if anchor not in s:
                  raise SystemExit('Modules include anchor not found')
              s = s.replace(anchor, anchor + inc)
          init = '    new WaterAlertGatewayModule();\n'
          anchor2 = '    hoboHttpGatewayModule = new HoboHttpGatewayModule();\n'
          if init not in s:
              if anchor2 not in s:
                  raise SystemExit('Modules init anchor not found')
              s = s.replace(anchor2, anchor2 + init)
          p.write_text(s)

          Path('HELTEC_GATEWAY_BUILD.txt').write_text(
              'Heltec Gateway 2026-09-10\n'
              'Target: Heltec V4 OLED / ESP32-S3\n'
              'Recovered/preserved: direct HOBO MX2001/MX2201/MX2203 BLE, logger-interval auto transmission, Meshtastic mesh, remote Home/Swell/Fishlake/Hidden Valley synchronized batching, device/battery telemetry, moisture/PIR compatibility, Fishlake polling, plus A02YYUW WATER_ALERT handling from fucking-around/fucking-around-heltec.\n'
              'Reliability: permanent remote telemetry uses the held queue; the held queue wakes the gateway worker; failed HOBO STATUS tracking falls back to interval-timed direct reads so Home cloud batches cannot silently pause.\n'
          )

      - name: Configure gateway credentials
        env:
          HOBO_HTTP_GATEWAY_INGEST_KEY: ${{ secrets.HOBO_HTTP_GATEWAY_INGEST_KEY }}
          WATER_GITHUB_TOKEN: ${{ secrets.WATER_GITHUB_TOKEN }}
        run: |
          if [ -z "$HOBO_HTTP_GATEWAY_INGEST_KEY" ]; then
            echo "::error::Repository secret HOBO_HTTP_GATEWAY_INGEST_KEY is not configured"
            exit 1
          fi
          python - <<'PY'
          import os
          from pathlib import Path
          def esc(v): return v.replace('\\', '\\\\').replace('"', '\\"')
          key = esc(os.environ['HOBO_HTTP_GATEWAY_INGEST_KEY'])
          water = esc(os.environ.get('WATER_GITHUB_TOKEN',''))
          Path('src/modules/hobo_gateway_secrets.h').write_text(
              '#pragma once\n'
              '#define HOBO_HTTP_GATEWAY_INGEST_KEY "' + key + '"\n'
              '#define WATER_GITHUB_TOKEN "' + water + '"\n'
          )
          PY

      - name: Commit consolidated production source
        run: |
          git config user.name "Canyon Country Firmware Bot"
          git config user.email "293924291+canyoncountryadventure@users.noreply.github.com"
          git add src/modules/HoboHttpGatewayModule.cpp src/modules/HoboBleSensorModule.cpp src/modules/Modules.cpp src/modules/WaterAlertGatewayModule.* HELTEC_GATEWAY_BUILD.txt || true
          if ! git diff --cached --quiet; then
            git commit -m "Consolidate Heltec gateway 2026-09-10 production firmware"
            git push origin HEAD:heltec-gateway-2026-09-10
          fi

      - name: Build Heltec V4
        uses: meshtastic/gh-action-firmware@main
        with:
          pio_platform: esp32s3
          pio_env: heltec-v4
          pio_target: build

      - name: Upload flashable firmware
        uses: actions/upload-artifact@v4
        with:
          name: heltec-gateway-2026-09-10-${{ github.run_number }}
          path: |
            release/*.bin
            release/*.zip
            release/*.mt.json
            release/device-*.sh
            release/device-*.bat
            .pio/build/heltec-v4/*.bin
