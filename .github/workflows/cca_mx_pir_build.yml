name: Trail Sensors Build

on:
  push:
    branches:
      - Trail-Sensors-v2
  pull_request:
    branches:
      - Trail-Sensors-v2
  workflow_dispatch:

permissions: read-all

concurrency:
  group: trail-sensors-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-pir-rock-hobo:
    name: Build PIR + Rock + HOBO
    uses: ./.github/workflows/build_firmware.yml
    with:
      version: TRAIL-PIR-ROCK-v2
      platform: nrf52840
      pio_env: seeed_xiao_nrf52840_cca_mx_pir

  build-sen0171:
    name: Build SEN0171 trail counter
    uses: ./.github/workflows/build_firmware.yml
    with:
      version: TRAIL-SEN0171-v2
      platform: nrf52840
      pio_env: seeed_xiao_nrf52840_trail

  settings-safe-ota:
    name: Package PIR/Rock settings-safe OTA
    needs: build-pir-rock-hobo
    runs-on: ubuntu-latest
    steps:
      - name: Download PIR/Rock firmware artifact
        uses: actions/download-artifact@v7
        with:
          name: firmware-nrf52840-seeed_xiao_nrf52840_cca_mx_pir-TRAIL-PIR-ROCK-v2
          path: firmware

      - name: Extract application-only OTA package
        shell: bash
        run: |
          set -euo pipefail
          OTA_FILE="$(find firmware -type f -name '*-ota.zip' -print -quit)"
          if [[ -z "$OTA_FILE" ]]; then
            echo "No nRF52 application OTA zip was produced"
            exit 1
          fi

          mkdir -p safe-ota
          cp "$OTA_FILE" safe-ota/Trail-PIR-Rock-HOBO-v2-OTA.zip

          python3 - <<'PY'
          import json, zipfile
          path = 'safe-ota/Trail-PIR-Rock-HOBO-v2-OTA.zip'
          with zipfile.ZipFile(path) as z:
              names = set(z.namelist())
              if 'manifest.json' not in names:
                  raise SystemExit('OTA package missing manifest.json')
              manifest = json.loads(z.read('manifest.json'))
              image = manifest.get('manifest', {})
              if set(image.keys()) - {'application', 'dfu_version'}:
                  raise SystemExit(f'Unexpected non-application DFU sections: {list(image.keys())}')
              if 'application' not in image:
                  raise SystemExit('OTA package is not application-only')
              app = image['application']
              if not app.get('bin_file') or not app.get('dat_file'):
                  raise SystemExit('OTA application entry missing bin/dat')
          print('Verified: application-only Nordic DFU package; no filesystem image present')
          PY

      - name: Upload normal-upgrade artifact
        uses: actions/upload-artifact@v7
        with:
          name: Trail-PIR-Rock-HOBO-v2-OTA
          path: safe-ota/Trail-PIR-Rock-HOBO-v2-OTA.zip
          if-no-files-found: error


  publish-permanent-v2:
    name: Publish stable Trail v2 downloads
    needs: [build-pir-rock-hobo, build-sen0171]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - name: Download PIR/Rock artifact
        uses: actions/download-artifact@v7
        with:
          name: firmware-nrf52840-seeed_xiao_nrf52840_cca_mx_pir-TRAIL-PIR-ROCK-v2
          path: pir
      - name: Download SEN0171 artifact
        uses: actions/download-artifact@v7
        with:
          name: firmware-nrf52840-seeed_xiao_nrf52840_trail-TRAIL-SEN0171-v2
          path: sen
      - name: Prepare stable names
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p export
          PIR_UF2="$(find pir -type f -name 'firmware-*.uf2' | head -n1)"
          PIR_OTA="$(find pir -type f -name '*-ota.zip' | head -n1)"
          SEN_UF2="$(find sen -type f -name 'firmware-*.uf2' | head -n1)"
          SEN_OTA="$(find sen -type f -name '*-ota.zip' | head -n1)"
          test -n "$PIR_UF2"; test -n "$PIR_OTA"; test -n "$SEN_UF2"; test -n "$SEN_OTA"
          test "$(stat -c%s "$PIR_UF2")" -gt 500000
          test "$(stat -c%s "$SEN_UF2")" -gt 500000
          cp "$PIR_UF2" export/Trail-PIR-Rock-HOBO-v2.uf2
          cp "$PIR_OTA" export/Trail-PIR-Rock-HOBO-v2-OTA.zip
          cp "$SEN_UF2" export/Trail-SEN0171-v2.uf2
          cp "$SEN_OTA" export/Trail-SEN0171-v2-OTA.zip
      - name: Checkout download branch
        uses: actions/checkout@v7
        with:
          ref: field-self-recovery
          path: publish
          fetch-depth: 0
      - name: Publish permanent files
        shell: bash
        run: |
          set -euo pipefail
          cd publish
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          latest_source_sha="$(git ls-remote origin refs/heads/Trail-Sensors-v2 | awk '{print $1}')"
          if [[ "$latest_source_sha" != "$GITHUB_SHA" ]]; then
            echo "Skipping stale Trail publish: run=$GITHUB_SHA latest=$latest_source_sha"
            exit 0
          fi

          for attempt in 1 2 3 4 5; do
            git fetch origin field-self-recovery
            git reset --hard origin/field-self-recovery
            mkdir -p downloads
            cp ../export/* downloads/
            git add downloads/Trail-*-v2*
            if git diff --cached --quiet; then exit 0; fi
            git commit -m "Publish Trail Sensors v2 downloads"
            if git push origin HEAD:field-self-recovery; then exit 0; fi
            sleep $((attempt * 3))
          done
          exit 1
