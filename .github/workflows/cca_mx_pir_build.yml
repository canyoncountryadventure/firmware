name: Trail Sensors Build

on:
  push:
    branches:
      - Trail-Sensors
  pull_request:
    branches:
      - Trail-Sensors
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-pir-rock-hobo:
    name: Build PIR + Rock + HOBO
    uses: ./.github/workflows/build_firmware.yml
    with:
      version: TRAIL-PIR-ROCK-v1
      platform: nrf52840
      pio_env: seeed_xiao_nrf52840_cca_mx_pir

  build-sen0171:
    name: Build SEN0171 trail counter
    uses: ./.github/workflows/build_firmware.yml
    with:
      version: TRAIL-SEN0171-v1
      platform: nrf52840
      pio_env: seeed_xiao_nrf52840_trail

  settings-safe-ota:
    name: Package PIR/Rock settings-safe OTA
    needs: build-pir-rock-hobo
    runs-on: ubuntu-latest
    steps:
      - name: Download PIR/Rock firmware artifact
        uses: actions/download-artifact@v7
        with:
          name: firmware-nrf52840-seeed_xiao_nrf52840_cca_mx_pir-TRAIL-PIR-ROCK-v1
          path: firmware

      - name: Extract application-only OTA package
        shell: bash
        run: |
          set -euo pipefail
          OTA_FILE="$(find firmware -type f -name '*-ota.zip' -print -quit)"
          if [[ -z "$OTA_FILE" ]]; then
            echo "No nRF52 application OTA zip was produced"
            exit 1
          fi

          mkdir -p safe-ota
          cp "$OTA_FILE" safe-ota/Trail-PIR-Rock-HOBO-v1-OTA.zip

          python3 - <<'PY'
          import json, zipfile
          path = 'safe-ota/Trail-PIR-Rock-HOBO-v1-OTA.zip'
          with zipfile.ZipFile(path) as z:
              names = set(z.namelist())
              if 'manifest.json' not in names:
                  raise SystemExit('OTA package missing manifest.json')
              manifest = json.loads(z.read('manifest.json'))
              image = manifest.get('manifest', {})
              if set(image.keys()) - {'application', 'dfu_version'}:
                  raise SystemExit(f'Unexpected non-application DFU sections: {list(image.keys())}')
              if 'application' not in image:
                  raise SystemExit('OTA package is not application-only')
              app = image['application']
              if not app.get('bin_file') or not app.get('dat_file'):
                  raise SystemExit('OTA application entry missing bin/dat')
          print('Verified: application-only Nordic DFU package; no filesystem image present')
          PY

      - name: Upload normal-upgrade artifact
        uses: actions/upload-artifact@v7
        with:
          name: Trail-PIR-Rock-HOBO-v1-OTA
          path: safe-ota/Trail-PIR-Rock-HOBO-v1-OTA.zip
          if-no-files-found: error

  retire-obsolete-branches:
    name: Retire superseded branches
    needs:
      - build-pir-rock-hobo
      - build-sen0171
      - settings-safe-ota
    if: github.event_name == 'push' && github.ref == 'refs/heads/Trail-Sensors'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout with authenticated origin
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Delete only explicitly superseded branches
        shell: bash
        run: |
          set -euo pipefail
          obsolete=(
            'CCA-MX-HOBO-PIR-ROCK-SEEED-v1'
            'CCA-MX-HOBO-PIR-SEEED-v1'
            'archive/cca-heltec-before-restore-2026-09-10'
            'archive/cca-heltec-sensor-gateway-final-2026-09-10'
            'archive/fucking-around-heltec-final-2026-09-10'
            'archive/heltec-gateway-2026-09-10-before-restore'
            'archive/heltec-gateway-2026-09-10-final'
            'cca-heltec-sensor-gateway'
            'fucking-around'
            'fucking-around-heltec'
            'heltec-gateway-2026-09-10'
            'heltec-gateway-clean-rebuild'
            'hobo-mx2001-mx2201-mx2203'
            'hobo-self-recovery-do-not-use'
            'hobo-self-recovery-final'
            'hobo-self-recovery-rak4631-v2'
            'hobo-self-recovery-rak4631'
            'hobo-self-recovery-seeed'
            'hobo-self-recovery-seeed-prod'
            'hobo-self-recovery-seeed-v2'
            'hobo-self-recovery-shared'
            'hobo-self-recovery-test'
            'hobo-self-recovery-working'
            'trail-sen0171'
          )

          echo 'Keeping canonical branches:'
          printf '%s\n' \
            field-self-recovery \
            Seeed-HOBO-Safe-v1 \
            RAK-HOBO-Safe-v1 \
            Heltec-Gateway-v1 \
            Seeed-Water-Distance-v1 \
            RAK-Water-Distance-v1 \
            Seeed-Water-Distance-HOBO-v1 \
            RAK-Water-Distance-HOBO-v1 \
            Trail-Sensors

          for branch in "${obsolete[@]}"; do
            if git ls-remote --exit-code --heads origin "refs/heads/$branch" >/dev/null 2>&1; then
              echo "Deleting $branch"
              git push origin --delete "$branch"
            else
              echo "Already absent: $branch"
            fi
          done
