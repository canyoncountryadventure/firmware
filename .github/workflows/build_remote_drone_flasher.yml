name: Build Remote Drone Flasher Catalog v2

on:
  push:
    branches:
      - Remote-Drone-Flashing-v2
    paths:
      - '.github/workflows/build_remote_drone_flasher.yml'
      - 'src/experimental/rak4631_drone_flasher.cpp'
      - 'src/experimental/embedded_dfu_image.h'
      - 'tools/build_drone_embedded_firmware.py'
      - 'variants/nrf52840/rak4631/platformio.ini'
      - 'README.md'
      - 'docs/RAK_REMOTE_DFU.md'
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: remote-drone-flasher-catalog-v2
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - key: rak-hobo-safe
            target_branch: RAK-HOBO-Safe-v2
            target_env: rak4631
            output_name: Drone-RAK-HOBO-Safe-v2.uf2
          - key: rak-soil-hobo
            target_branch: RAK-Soil-Moisture-HOBO-v2
            target_env: rak4631
            output_name: Drone-RAK-Soil-Moisture-HOBO-v2.uf2
          - key: rak-water
            target_branch: RAK-Water-Distance-v2
            target_env: rak4631
            output_name: Drone-RAK-Water-Distance-v2.uf2
          - key: rak-water-hobo
            target_branch: RAK-Water-Distance-HOBO-v2
            target_env: rak4631
            output_name: Drone-RAK-Water-Distance-HOBO-v2.uf2
          - key: canonical-rak
            target_branch: field-self-recovery-v2
            target_env: rak4631
            output_name: Drone-Field-Self-Recovery-v2-RAK4631.uf2
          - key: seeed-water-hobo
            target_branch: Seeed-Water-Distance-HOBO-v2
            target_env: seeed_xiao_nrf52840_kit
            output_name: Drone-Seeed-Water-Distance-HOBO-v2.uf2

    runs-on: ubuntu-latest
    name: build-${{ matrix.key }}

    steps:
      - name: Checkout drone branch
        uses: actions/checkout@v7
        with:
          ref: Remote-Drone-Flashing-v2
          path: drone
          submodules: recursive

      - name: Checkout target branch
        uses: actions/checkout@v7
        with:
          ref: ${{ matrix.target_branch }}
          path: target
          submodules: recursive

      - name: Install build tools
        run: |
          python -m pip install --upgrade platformio lz4

      - name: Build normal target firmware
        shell: bash
        run: |
          set -euo pipefail
          cd target
          pio run -e ${{ matrix.target_env }}

      - name: Locate target OTA and record target commit
        id: target
        shell: bash
        run: |
          set -euo pipefail
          TARGET_SHA="$(git -C target rev-parse HEAD)"
          OTA="$(find target/.pio/build/${{ matrix.target_env }} -maxdepth 1 -type f -name 'firmware-*-ota.zip' | sort | head -n 1)"
          test -n "$OTA"
          test -f "$OTA"
          echo "sha=$TARGET_SHA" >> "$GITHUB_OUTPUT"
          echo "ota=$OTA" >> "$GITHUB_OUTPUT"
          echo "Target branch: ${{ matrix.target_branch }}"
          echo "Target commit: $TARGET_SHA"
          echo "Target OTA: $OTA"

      - name: Compress and embed exact target OTA
        shell: bash
        run: |
          set -euo pipefail
          python drone/tools/build_drone_embedded_firmware.py             "${{ steps.target.outputs.ota }}"             drone/src/experimental/embedded_dfu_image.h

      - name: Build autonomous drone flasher
        shell: bash
        run: |
          set -euo pipefail
          cd drone
          pio run -e rak4631_drone_flasher 2>&1 | tee ../drone-flasher-build.log

      - name: Package compressed drone UF2
        shell: bash
        run: |
          set -euo pipefail
          SCOUT="$(find drone/.pio/build/rak4631_drone_flasher -maxdepth 1 -type f -name '*.uf2' | sort | head -n 1)"
          test -n "$SCOUT"
          test -f "$SCOUT"
          test "$(stat -c%s "$SCOUT")" -gt 500000
          mkdir -p export
          cp "$SCOUT" "export/${{ matrix.output_name }}"
          {
            echo "Drone flasher: ${{ matrix.output_name }}"
            echo "Target branch: ${{ matrix.target_branch }}"
            echo "Target commit: ${{ steps.target.outputs.sha }}"
            echo "Embedded payload: LZ4-compressed application OTA"
            echo "Scout UF2 bytes: $(stat -c%s "$SCOUT")"
            sha256sum "$SCOUT"
          } > "export/${{ matrix.output_name }}.txt"

      - name: Upload compressed drone artifact
        uses: actions/upload-artifact@v7
        with:
          name: drone-${{ matrix.key }}
          overwrite: true
          retention-days: 30
          path: export/*

  publish:
    name: Publish drone firmware catalog
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read

    steps:
      - name: Checkout drone branch for publishing
        uses: actions/checkout@v7
        with:
          ref: Remote-Drone-Flashing-v2
          path: publish
          fetch-depth: 0

      - name: Download all matched drone images
        uses: actions/download-artifact@v7
        with:
          pattern: drone-*
          path: built
          merge-multiple: true

      - name: Publish compressed drone UF2 catalog
        shell: bash
        run: |
          set -euo pipefail
          cd publish
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          latest_source_sha="$(git ls-remote origin refs/heads/Remote-Drone-Flashing-v2 | awk '{print $1}')"
          if [[ "$latest_source_sha" != "$GITHUB_SHA" ]]; then
            echo "Skipping stale drone catalog publish: run=$GITHUB_SHA latest=$latest_source_sha"
            exit 0
          fi

          mkdir -p downloads
          cp ../built/Drone-*.uf2 downloads/
          cp ../built/Drone-*.uf2.txt downloads/

          git add downloads/Drone-*.uf2 downloads/Drone-*.uf2.txt
          if git diff --cached --quiet; then
            echo "Drone catalog already current"
            exit 0
          fi

          git commit -m "Publish compressed drone firmware catalog v2"
          git push origin HEAD:Remote-Drone-Flashing-v2
