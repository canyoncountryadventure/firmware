name: Build Remote Drone Flasher

on:
  push:
    branches:
      - Remote-Drone-Flashing
    paths:
      # The Scout embeds the target application, so any source/config change
      # that can alter either side must rebuild the matched pair.
      - 'src/**'
      - 'tools/build_drone_embedded_firmware.py'
      - 'variants/nrf52840/rak4631/**'
      - 'platformio.ini'
      - '.github/workflows/build_remote_drone_flasher.yml'
  workflow_dispatch:

permissions: read-all

concurrency:
  group: remote-drone-flasher-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    name: build-autonomous-drone-flasher

    steps:
      - name: Checkout triggering commit
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Install build tools
        run: |
          python -m pip install --upgrade platformio lz4

      - name: Build target application
        shell: bash
        run: |
          set -euo pipefail
          pio run -e rak4631

      - name: Generate embedded target image
        shell: bash
        run: |
          set -euo pipefail
          OTA="$(find .pio/build/rak4631 -maxdepth 1 -type f -name 'firmware-rak4631-*.zip' | sort | head -n 1)"
          test -n "$OTA"
          echo "Embedding target OTA: $OTA"
          python tools/build_drone_embedded_firmware.py             "$OTA"             src/experimental/embedded_dfu_image.h

      - name: Build autonomous drone flasher
        shell: bash
        run: |
          set -euo pipefail
          pio run -e rak4631_drone_flasher 2>&1 | tee remote-drone-flasher-build.log

      - name: Package validated outputs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p export

          TARGET_UF2="$(find .pio/build/rak4631 -maxdepth 1 -type f -name 'firmware-rak4631-*.uf2' | sort | head -n 1)"
          TARGET_OTA="$(find .pio/build/rak4631 -maxdepth 1 -type f -name 'firmware-rak4631-*.zip' | sort | head -n 1)"
          DRONE_UF2="$(find .pio/build/rak4631_drone_flasher -maxdepth 1 -type f -name '*.uf2' | sort | head -n 1)"

          test -n "$TARGET_UF2"
          test -n "$TARGET_OTA"
          test -n "$DRONE_UF2"

          TARGET_UF2_SIZE="$(stat -c%s "$TARGET_UF2")"
          TARGET_OTA_SIZE="$(stat -c%s "$TARGET_OTA")"
          DRONE_UF2_SIZE="$(stat -c%s "$DRONE_UF2")"

          test "$TARGET_UF2_SIZE" -gt 1000000
          test "$TARGET_OTA_SIZE" -gt 500000
          test "$DRONE_UF2_SIZE" -gt 500000

          TARGET_VERSION="$(basename "$TARGET_UF2" .uf2)"
          TARGET_VERSION="${TARGET_VERSION#firmware-rak4631-}"

          cp "$TARGET_UF2" "export/RAK4631-HOBO-DFU-Target-${TARGET_VERSION}.uf2"
          cp "$TARGET_OTA" "export/RAK4631-HOBO-DFU-Target-${TARGET_VERSION}-OTA.zip"
          cp "$DRONE_UF2" "export/RAK4631-Remote-Drone-Flasher-embeds-${TARGET_VERSION}.uf2"

          # Stable aliases for users who do not need the version in the filename.
          cp "$TARGET_UF2" export/RAK4631-HOBO-DFU-Target.uf2
          cp "$TARGET_OTA" export/RAK4631-HOBO-DFU-Target-OTA.zip
          cp "$DRONE_UF2" export/RAK4631-Remote-Drone-Flasher.uf2
          cp remote-drone-flasher-build.log export/

          {
            echo "Remote Drone Flashing matched build"
            echo "Commit: ${GITHUB_SHA}"
            echo "Target version: ${TARGET_VERSION}"
            echo "Target UF2: ${TARGET_UF2_SIZE} bytes"
            echo "Target OTA: ${TARGET_OTA_SIZE} bytes"
            echo "Drone UF2: ${DRONE_UF2_SIZE} bytes"
            echo "Drone embeds target: ${TARGET_VERSION}"
          } > export/BUILD.txt

      - name: Upload Remote Drone Flashing package
        uses: actions/upload-artifact@v7
        with:
          name: remote-drone-flashing-${{ github.run_number }}
          overwrite: true
          retention-days: 30
          if-no-files-found: error
          path: export/*
