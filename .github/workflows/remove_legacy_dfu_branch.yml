name: Remove Legacy DFU Branch

on:
  push:
    branches:
      - Remote-Drone-Flashing
    paths:
      - '.github/workflows/remove_legacy_dfu_branch.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  remove:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout new branch
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Delete legacy esp-32-testing branch
        shell: bash
        run: |
          set -euo pipefail
          if git ls-remote --exit-code --heads origin refs/heads/esp-32-testing >/dev/null 2>&1; then
            git push origin --delete esp-32-testing
            echo "Deleted esp-32-testing"
          else
            echo "esp-32-testing is already absent"
          fi
