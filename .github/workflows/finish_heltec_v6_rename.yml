name: Finish requested Heltec V6 rename
on:
  push:
    branches: [Heltec-Gateway-v6]
    paths: ['.github/workflows/finish_heltec_v6_rename.yml']
permissions:
  contents: write
jobs:
  finish-rename:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: Heltec-Gateway-v6
      - name: Verify renamed published artifacts
        run: |
          set -euo pipefail
          cd downloads/Heltec-Gateway-v6
          grep -E '^[0-9a-f]{64}  ' BUILD.txt | sha256sum --check --strict
          test ! -d ../Heltec-Gateway-v7
      - name: Remove superseded V7 branch with lease
        run: |
          set -euo pipefail
          old_ref=refs/heads/Heltec-Gateway-v7
          expected=e62c62470bbb6a3ce37bacd0a8b35a438f4890b2
          actual="$(git ls-remote origin "$old_ref" | cut -f1)"
          if [[ -n "$actual" ]]; then
            test "$actual" = "$expected"
            git push --force-with-lease="$old_ref:$expected" origin ":$old_ref"
          fi
      - name: Remove completed one-time cleanup workflow
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/finish_heltec_v6_rename.yml
          git commit -m 'Complete Heltec V7 to V6 rename; remove one-time cleanup [skip ci]'
          git push origin HEAD:Heltec-Gateway-v6
