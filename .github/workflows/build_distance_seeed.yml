name: Build Seeed Water Distance HOBO v1

on:
  push:
    branches:
      - Seeed-Water-Distance-HOBO-v1
  workflow_dispatch:

concurrency:
  group: Seeed-Water-Distance-HOBO-v1
  cancel-in-progress: true

permissions: read-all

jobs:
  build-seeed-water-distance-hobo:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Seeed Water Distance HOBO v1 branch
        uses: actions/checkout@v7
        with:
          ref: Seeed-Water-Distance-HOBO-v1
          submodules: recursive

      - name: Build Seeed XIAO nRF52840 Kit
        uses: meshtastic/gh-action-firmware@main
        with:
          pio_platform: nrf52840
          pio_env: seeed_xiao_nrf52840_kit
          pio_target: build

      - name: Upload firmware artifacts
        uses: actions/upload-artifact@v7
        with:
          name: Seeed-Water-Distance-HOBO-v1-${{ github.run_number }}
          overwrite: true
          retention-days: 30
          path: |
            release/*.uf2
            release/*.zip
            release/*.bin
            release/*.elf
            release/*.map
            release/*.mt.json
