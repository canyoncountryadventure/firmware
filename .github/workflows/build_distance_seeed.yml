name: Build Seeed Water Distance v2

on:
  push:
    branches:
      - Seeed-Water-Distance-v2
  workflow_dispatch:

concurrency:
  group: Seeed-Water-Distance-v2
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build-seeed-water-distance:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Seeed Water Distance v2 branch
        uses: actions/checkout@v7
        with:
          ref: Seeed-Water-Distance-v2
          submodules: recursive

      - name: Build Seeed XIAO nRF52840 Kit
        uses: meshtastic/gh-action-firmware@39d0ffe8e0708beb3fb7b66f4c91aa941dc9764e
        with:
          pio_platform: nrf52840
          pio_env: seeed_xiao_nrf52840_kit
          pio_target: build

      - name: Upload firmware artifacts
        uses: actions/upload-artifact@v7
        with:
          name: Seeed-Water-Distance-v2-${{ github.run_number }}
          overwrite: true
          retention-days: 30
          path: |
            release/*.uf2
            release/*.zip
            release/*.bin
            release/*.elf
            release/*.map
            release/*.mt.json

      - name: Prepare permanent downloads
        shell: bash
        run: |
          set -euo pipefail
          UF2="$(find release -maxdepth 1 -type f -name 'firmware-seeed_xiao_nrf52840_kit-*.uf2' | head -n 1)"
          OTA="$(find release -maxdepth 1 -type f -name 'firmware-seeed_xiao_nrf52840_kit-*-ota.zip' | head -n 1)"
          test -n "$UF2"
          test -n "$OTA"
          mkdir -p export
          cp "$UF2" export/Seeed-Water-Distance-v2.uf2
          cp "$OTA" export/Seeed-Water-Distance-v2-OTA.zip

      - name: Checkout firmware download branch
        uses: actions/checkout@v7
        with:
          ref: field-self-recovery
          path: publish
          fetch-depth: 0

      - name: Publish permanent downloads
        shell: bash
        run: |
          set -euo pipefail
          cd publish
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3 4 5; do
            git fetch origin field-self-recovery
            git reset --hard origin/field-self-recovery
            mkdir -p downloads
            cp ../export/Seeed-Water-Distance-v2.uf2 downloads/
            cp ../export/Seeed-Water-Distance-v2-OTA.zip downloads/
            git add downloads/Seeed-Water-Distance-v2.uf2 downloads/Seeed-Water-Distance-v2-OTA.zip
            if git diff --cached --quiet; then
              echo "Downloads already current"
              exit 0
            fi
            git commit -m "Publish Seeed Water Distance v2 downloads"
            if git push origin HEAD:field-self-recovery; then
              exit 0
            fi
            sleep $((attempt * 3))
          done
          echo "Failed to publish downloads after retries" >&2
          exit 1
