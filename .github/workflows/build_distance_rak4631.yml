name: Build Water Distance RAK4631

on:
  push:
    branches:
      - water-distance-rak4631
  workflow_dispatch:

concurrency:
  group: water-distance-rak4631
  cancel-in-progress: true

permissions: read-all

jobs:
  build-rak-water-distance:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout water distance RAK4631 branch
        uses: actions/checkout@v7
        with:
          ref: water-distance-rak4631
          submodules: recursive

      - name: Build RAK4631
        uses: meshtastic/gh-action-firmware@main
        with:
          pio_platform: nrf52840
          pio_env: rak4631
          pio_target: build

      - name: Upload firmware artifacts
        uses: actions/upload-artifact@v7
        with:
          name: water-distance-rak4631-${{ github.run_number }}
          overwrite: true
          retention-days: 30
          path: |
            release/*.uf2
            release/*.zip
            release/*.bin
            release/*.elf
            release/*.map
            release/*.mt.json
