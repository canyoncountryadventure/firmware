name: Build MB7388 Diagnostic RAK4631

on:
  push:
    branches:
      - diag-MB7388-100-20261009
  workflow_dispatch:

concurrency:
  group: diag-MB7388-100-20261009
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build-rak-water-distance-hobo:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout RAK Water Distance HOBO v4 branch
        uses: actions/checkout@v7
        with:
          ref: diag-MB7388-100-20261009
          submodules: recursive

      - name: Build RAK4631
        uses: meshtastic/gh-action-firmware@39d0ffe8e0708beb3fb7b66f4c91aa941dc9764e
        with:
          pio_platform: nrf52840
          pio_env: rak4631
          pio_target: build

      - name: Upload firmware artifacts
        uses: actions/upload-artifact@v7
        with:
          name: MB7388-Diagnostic-RAK4631-${{ github.run_number }}
          overwrite: true
          retention-days: 30
          path: |
            release/*.uf2
            release/*.zip
            release/*.bin
            release/*.elf
            release/*.map
            release/*.mt.json
            drone-out/*.uf2

      - name: Prepare permanent downloads
        shell: bash
        run: |
          set -euo pipefail
          UF2="$(find release -maxdepth 1 -type f -name 'firmware-rak4631-*.uf2' | head -n 1)"
          OTA="$(find release -maxdepth 1 -type f -name 'firmware-rak4631-*-ota.zip' | head -n 1)"
          test -n "$UF2"
          test -n "$OTA"
          SCOUT="drone-out/scout.uf2"
          mkdir -p export
          cp "$UF2" export/MB7388-Diagnostic-RAK4631.uf2
          cp "$OTA" export/MB7388-Diagnostic-RAK4631-OTA.zip

