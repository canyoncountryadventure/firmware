name: Build RAK Water Distance HOBO v1

on:
  push:
    branches:
      - RAK-Water-Distance-HOBO-v1
  workflow_dispatch:

concurrency:
  group: RAK-Water-Distance-HOBO-v1
  cancel-in-progress: true

permissions: read-all

jobs:
  build-rak-water-distance-hobo:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout RAK Water Distance HOBO v1 branch
        uses: actions/checkout@v7
        with:
          ref: RAK-Water-Distance-HOBO-v1
          submodules: recursive

      - name: Build RAK4631
        uses: meshtastic/gh-action-firmware@main
        with:
          pio_platform: nrf52840
          pio_env: rak4631
          pio_target: build

      - name: Upload firmware artifacts
        uses: actions/upload-artifact@v7
        with:
          name: RAK-Water-Distance-HOBO-v1-${{ github.run_number }}
          overwrite: true
          retention-days: 30
          path: |
            release/*.uf2
            release/*.zip
            release/*.bin
            release/*.elf
            release/*.map
            release/*.mt.json
