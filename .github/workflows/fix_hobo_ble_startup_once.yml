name: Fix HOBO BLE startup once

on:
  push:
    branches:
      - cca-heltec-sensor-gateway
    paths:
      - '.github/workflows/fix_hobo_ble_startup_once.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cca-heltec-sensor-gateway
          fetch-depth: 0

      - name: Patch HOBO BLE startup dependency
        shell: python
        run: |
          from pathlib import Path
          path = Path('src/modules/HoboBleSensorModule.cpp')
          text = path.read_text()
          old = "    if (!initialized) {\n        if (!nimbleBluetooth || !nimbleBluetooth->isActive())\n            return 1000;\n        initializeClient();\n        return 250;\n    }\n"
          new = "    if (!initialized) {\n#ifdef NIMBLE_TWO\n        const bool nimbleReady = NimBLEDevice::isInitialized();\n#else\n        const bool nimbleReady = NimBLEDevice::getInitialized();\n#endif\n        if (!nimbleReady) {\n            LOG_INFO(\"CCA HOBO: NimBLE not initialized by Meshtastic; initializing BLE central\");\n            NimBLEDevice::init(\"\");\n        } else if (!nimbleBluetooth || !nimbleBluetooth->isActive()) {\n            LOG_INFO(\"CCA HOBO: Meshtastic phone BLE inactive; continuing with BLE central\");\n        }\n        initializeClient();\n        return 250;\n    }\n"
          if old not in text:
              raise SystemExit('Expected startup block not found; refusing blind patch')
          path.write_text(text.replace(old, new, 1))

      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/modules/HoboBleSensorModule.cpp
          git commit -m "Fix HOBO BLE startup when phone BLE is inactive"
          git push origin HEAD:cca-heltec-sensor-gateway
