name: Build and Publish RAK Water HOBO V6 (dated field and Scout)
on:
  push:
    branches: [RAK-Water-Distance-HOBO-v6]
    paths:
      - "src/**"
      - "test/test_hobo_v5/**"
      - "test/test_hobo_v6/**"
      - "variants/**"
      - "boards/**"
      - "bin/**"
      - "tools/build_drone_embedded_firmware.py"
      - "tools/verify_drone_audit.py"
      - "platformio.ini"
      - "version.properties"
      - "userPrefs.jsonc"
      - ".github/workflows/build_rak_water_v5.yml"
      - "tools/publish_rak_v6_readme.py"
  workflow_dispatch:
concurrency:
  group: rak-water-hobo-v6
  cancel-in-progress: true
env:
  PLATFORMIO_SETTING_ENABLE_TELEMETRY: "false"
permissions:
  contents: read
jobs:
  recovery-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - run: |
          python3 test/test_hobo_v5/test_hobo_v5.py
          python3 test/test_hobo_v5/test_preservation.py
          python3 test/test_hobo_v5/test_reset_recovery.py
          python3 test/test_hobo_v5/test_nonblocking_water.py
          python3 test/test_hobo_v5/test_water_jobs.py
          python3 test/test_hobo_v6/test_new_features.py
  build:
    needs: recovery-tests
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - sensor: SEN0313
            target: rak4631_sen0313_v5
          - sensor: MB7388
            target: rak4631_mb7388_v5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          submodules: recursive
      - name: Build RAK4631 ${{ matrix.sensor }}
        uses: meshtastic/gh-action-firmware@39d0ffe8e0708beb3fb7b66f4c91aa941dc9764e
        with:
          pio_platform: nrf52840
          pio_env: ${{ matrix.target }}
          pio_target: build
      - name: Name downloads
        env:
          SENSOR: ${{ matrix.sensor }}
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          mkdir -p export
          BUILD_DATE="$(TZ=America/Denver date +%m-%d-%y)"
          echo "BUILD_DATE=$BUILD_DATE" >> "$GITHUB_ENV"
          BUILD_TAG="$BUILD_DATE-${GITHUB_SHA:0:7}"
          echo "BUILD_TAG=$BUILD_TAG" >> "$GITHUB_ENV"
          printf '%s\n' "$BUILD_DATE" > "export/BUILD-DATE-$SENSOR.txt"
          uf2_path="$(find release -maxdepth 1 -name "firmware-$TARGET-*.uf2" -print -quit)"
          ota_path="$(find release -maxdepth 1 -name "firmware-$TARGET-*-ota.zip" -print -quit)"
          test -n "$uf2_path"
          test -n "$ota_path"
          cp "$uf2_path" "export/field-rak-hobo-distance-$BUILD_TAG-$SENSOR.uf2"
          cp "$ota_path" "export/field-rak-hobo-distance-$BUILD_TAG-$SENSOR-OTA.zip"
          python3 bin/verify_rak_v6.py "export/field-rak-hobo-distance-$BUILD_TAG-$SENSOR.uf2" "$GITHUB_SHA"
          python3 bin/verify_rak_audit_package.py "export/field-rak-hobo-distance-$BUILD_TAG-$SENSOR.uf2" "export/field-rak-hobo-distance-$BUILD_TAG-$SENSOR-OTA.zip"
          (cd export && sha256sum *.uf2 *.zip) > "export/SHA256-$SENSOR.txt"
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: 37306158a64266fd05dfcd3bf01c5b47d0dc35fa
          path: scout
      - name: Build matched autonomous Scout
        env:
          SENSOR: ${{ matrix.sensor }}
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          python3 -m pip install platformio==6.2.0 lz4
          python3 tools/build_drone_embedded_firmware.py "export/field-rak-hobo-distance-$BUILD_TAG-$SENSOR-OTA.zip" scout/src/experimental/embedded_dfu_image.h
          pio run --project-dir scout -e rak4631_drone_flasher
          scout_uf2="$(find scout/.pio/build/rak4631_drone_flasher -maxdepth 1 -name 'firmware-*.uf2' -print -quit)"
          test -n "$scout_uf2"
          output="export/drone-rak-hobo-distance-$BUILD_TAG-$SENSOR.uf2"
          cp "$scout_uf2" "$output"
          python3 tools/verify_drone_audit.py "$output" "export/field-rak-hobo-distance-$BUILD_TAG-$SENSOR-OTA.zip" scout/src/experimental/embedded_dfu_image.h "$GITHUB_SHA"
          {
            echo "Target source commit: $GITHUB_SHA"
            echo "Target environment: $TARGET"
            echo 'Scout implementation commit: 37306158a64266fd05dfcd3bf01c5b47d0dc35fa'
            echo 'Exact embedded application and DAT verified; both LZ4 decoders verified'
            sha256sum "$output" "export/field-rak-hobo-distance-$BUILD_TAG-$SENSOR-OTA.zip"
          } > "$output.txt"
          (cd export && sha256sum *.uf2 *.zip) > "export/SHA256-$SENSOR.txt"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: RAK-HOBO-v6-CANDIDATE-${{ matrix.sensor }}
          path: export/*
          if-no-files-found: error
          retention-days: 30

  publish-v6:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - name: Download exactly matched field and Scout artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: RAK-HOBO-v6-CANDIDATE-*
          merge-multiple: true
          path: export
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: RAK-Water-Distance-HOBO-v6
          path: publish
      - name: Verify and publish V6 date-stamped release
        shell: bash
        run: |
          set -euo pipefail
          cd publish
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          mkdir -p downloads/RAK-HOBO-v6
          cp ../export/* downloads/RAK-HOBO-v6/
          python3 tools/publish_rak_v6_readme.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add downloads/RAK-HOBO-v6 README.md
          git diff --cached --quiet && { echo 'No release changes'; exit 0; }
          git commit -m 'Publish verified dated RAK V6 field and matching Scout firmware [skip ci]'
          git push origin HEAD:RAK-Water-Distance-HOBO-v6
