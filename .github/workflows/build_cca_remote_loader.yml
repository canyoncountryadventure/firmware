name: Build CCA Heltec V10 self-update loader (USB install once)
on:
  push:
    branches: [Heltec-Gateway-v10]
    paths:
      - 'tools/cca_remote_ota/**'
      - '.github/workflows/build_cca_remote_loader.yml'
  workflow_dispatch:
permissions: read-all
jobs:
  self-update-loader:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout current V10 source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Install Python and PlatformIO
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - run: python -m pip install --upgrade platformio==6.1.18
      - name: Fetch reviewed upstream unified OTA loader
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/cca-loader
          git -C /tmp/cca-loader init
          git -C /tmp/cca-loader remote add origin https://github.com/meshtastic/esp32-unified-ota.git
          git -C /tmp/cca-loader fetch --depth 1 origin 6258997041a3b6c06b7581bb91421000025d1f2b
          git -C /tmp/cca-loader checkout --detach FETCH_HEAD
          test "$(git -C /tmp/cca-loader rev-parse HEAD)" = "6258997041a3b6c06b7581bb91421000025d1f2b"
      - name: Apply CCA stage installer overlay and check invariants
        run: |
          python tools/cca_remote_ota/patch_upstream.py /tmp/cca-loader
          python tools/cca_remote_ota/test_stage_contract.py /tmp/cca-loader
      - name: Build ESP32-S3 unified loader
        run: |
          cd /tmp/cca-loader
          pio run -e esp32s3
      - name: Verify loader fits protected 640 KiB region
        shell: bash
        run: |
          set -euo pipefail
          bin=/tmp/cca-loader/.pio/build/esp32s3/firmware.bin
          test -s "$bin"
          size=$(stat -c %s "$bin")
          echo "Loader application size: $size bytes"
          test "$size" -lt 655360 || { echo "::error::Loader too large for reserved OTA_1 region"; exit 1; }
          mkdir -p loader-release
          cp "$bin" loader-release/CCA-Heltec-V10-Remote-Loader-11-25-26.bin
          sha256sum loader-release/*.bin > loader-release/SHA256SUMS.txt
          echo 'USB-only loader offset: 0x650000 (16 MB Heltec V4)' > loader-release/INSTALL-NOTE.txt
          echo 'Do not write at 0x0; do not erase NVS or repartition.' >> loader-release/INSTALL-NOTE.txt
      - name: Publish verified loader as build artifact (not an automatic flash)
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: cca-heltec-v10-remote-loader
          path: loader-release/*
