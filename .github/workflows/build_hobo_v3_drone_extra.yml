name: Build remaining canonical and Trail HOBO V3 drone images

on:
  push:
    branches:
      - Remote-Drone-Flashing-v2
    paths:
      - '.github/workflows/build_hobo_v3_drone_extra.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: hobo-v3-drone-extra
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - key: canonical-rak-hobo-v3
            target_branch: field-self-recovery-v3
            target_env: rak4631
            output_name: Drone-Field-Self-Recovery-v3-RAK4631.uf2
          - key: canonical-seeed-hobo-v3
            target_branch: field-self-recovery-v3
            target_env: seeed_xiao_nrf52840_kit
            output_name: Drone-Field-Self-Recovery-v3-Seeed.uf2
          - key: trail-pir-rock-hobo-v3
            target_branch: Trail-Sensors-v3
            target_env: seeed_xiao_nrf52840_cca_mx_pir
            output_name: Drone-Trail-PIR-Rock-HOBO-v3.uf2

    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout drone catalog
        uses: actions/checkout@v7
        with:
          ref: Remote-Drone-Flashing-v2
          path: publish
          fetch-depth: 0

      - name: Gather V3 drone images
        uses: actions/download-artifact@v7
        with:
          pattern: drone-*
          path: built
          merge-multiple: true

      - name: Publish V3 Scout catalog, preserving V2 images
        shell: bash
        run: |
          set -euo pipefail
          cd publish
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          latest="$(git ls-remote origin refs/heads/Remote-Drone-Flashing-v2 | awk '{print $1}')"
          if [[ "$latest" != "$GITHUB_SHA" ]]; then
            echo "Skip stale matched Scout run $GITHUB_SHA (now $latest)"
            exit 0
          fi
          for attempt in 1 2 3 4 5; do
            git fetch origin Remote-Drone-Flashing-v2
            git reset --hard origin/Remote-Drone-Flashing-v2
            mkdir -p downloads
            cp ../built/Drone-*-v3.uf2 downloads/
            cp ../built/Drone-*-v3.uf2.txt downloads/
            git add downloads/Drone-*-v3.uf2 downloads/Drone-*-v3.uf2.txt
            if git diff --cached --quiet; then
              echo "V3 Scout catalog already current"
              exit 0
            fi
            git commit -m "Publish matched HOBO V3 Scout images"
            if git push origin HEAD:Remote-Drone-Flashing-v2; then exit 0; fi
            sleep $((attempt * 3))
          done
          echo "Could not publish matched V3 Scouts" >&2
          exit 1
