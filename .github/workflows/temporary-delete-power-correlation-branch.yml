name: One-time delete obsolete power-correlation diagnostic branch
on:
  push:
    branches:
      - diag/v5-pololu-io1-off
    paths:
      - .github/workflows/temporary-delete-power-correlation-branch.yml
permissions:
  contents: write
jobs:
  delete-obsolete-branch:
    if: github.ref == 'refs/heads/diag/v5-pololu-io1-off'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Delete only the user-specified temporary correlation branch
        run: |
          set -euo pipefail
          target=diag/v5-pololu-power-correlation
          git ls-remote --exit-code --heads origin "refs/heads/$target"
          git push origin --delete "$target"
          if git ls-remote --exit-code --heads origin "refs/heads/$target"; then
            echo "ERROR: branch still present" >&2
            exit 1
          fi
          echo "CONFIRMED: $target no longer exists."
