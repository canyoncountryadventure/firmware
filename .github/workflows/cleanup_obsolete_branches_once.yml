name: One-Time Branch Cleanup

on:
  push:
    branches:
      - field-self-recovery
    paths:
      - '.github/workflows/cleanup_obsolete_branches_once.yml'

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout authenticated repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Delete obsolete branches
        shell: bash
        run: |
          set -euo pipefail

          keep=(
            'field-self-recovery'
            'Seeed-HOBO-Safe-v1'
            'RAK-HOBO-Safe-v1'
            'Heltec-Gateway-v1'
            'Seeed-Water-Distance-v1'
            'RAK-Water-Distance-v1'
            'Seeed-Water-Distance-HOBO-v1'
            'RAK-Water-Distance-HOBO-v1'
            'Trail-Sensors'
          )

          echo 'Keeping:'
          printf '  %s\n' "${keep[@]}"

          mapfile -t branches < <(
            git ls-remote --heads origin |
              sed 's#.*refs/heads/##' |
              sort
          )

          for branch in "${branches[@]}"; do
            keep_it=false
            for canonical in "${keep[@]}"; do
              if [[ "$branch" == "$canonical" ]]; then
                keep_it=true
                break
              fi
            done

            if [[ "$keep_it" == true ]]; then
              echo "KEEP   $branch"
            else
              echo "DELETE $branch"
              git push origin --delete "$branch"
            fi
          done
