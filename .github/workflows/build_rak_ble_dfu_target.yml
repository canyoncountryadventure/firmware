name: Build RAK4631 BLE DFU Target

on:
  push:
    branches:
      - esp-32-testing
    paths:
      - 'src/modules/Telemetry/HOBOMX2001MX2201MX2203/HOBOMX2001MX2201MX2203Telemetry.cpp'
      - 'src/modules/Telemetry/HOBOMX2001MX2201MX2203/HOBOMX2001MX2201MX2203TelemetryRAK.cpp'
      - 'variants/nrf52840/rak4631/platformio.ini'
      - '.github/workflows/build_rak_ble_dfu_target.yml'
  workflow_dispatch:

permissions: read-all

concurrency:
  group: rak-ble-dfu-target-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    name: build-rak4631-ble-dfu-target
    steps:
      - name: Checkout triggering commit
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Build normal RAK4631 Meshtastic target
        uses: meshtastic/gh-action-firmware@main
        with:
          pio_platform: nrf52840
          pio_env: rak4631
          pio_target: build

      - name: Prepare visible target artifacts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p export
          UF2="$(find .pio/build/rak4631 -maxdepth 1 -type f -name 'firmware-rak4631-*.uf2' | sort | head -n 1)"
          test -n "$UF2"
          UF2_SIZE="$(stat -c%s "$UF2")"
          test "$UF2_SIZE" -gt 1000000
          echo "Packaging full application UF2: $UF2 ($UF2_SIZE bytes)"
          cp "$UF2" export/RAK4631-Meshtastic-HOBO-BLE-DFU-Target.uf2

          OTA="$(find release -maxdepth 1 -type f -name 'firmware-rak4631-*-ota.zip' | sort | head -n 1 || true)"
          test -n "$OTA"
          OTA_SIZE="$(stat -c%s "$OTA")"
          test "$OTA_SIZE" -gt 500000
          echo "Packaging application OTA ZIP: $OTA ($OTA_SIZE bytes)"
          cp "$OTA" export/RAK4631-Meshtastic-HOBO-BLE-DFU-Target-OTA.zip

      - name: Upload target firmware
        uses: actions/upload-artifact@v7
        with:
          name: rak4631-ble-dfu-target-${{ github.run_number }}
          overwrite: true
          retention-days: 30
          if-no-files-found: error
          path: |
            export/*
            release/*.mt.json
