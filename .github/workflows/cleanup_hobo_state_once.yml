name: Cleanup HOBO State Once

on:
  push:
    branches:
      - cca-heltec-sensor-gateway
    paths:
      - .github/workflows/cleanup_hobo_state_once.yml

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: cca-heltec-sensor-gateway
      - name: Normalize HOBO state enum references
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p = Path('src/modules/HoboBleSensorModule.cpp')
          s = p.read_text(encoding='utf-8')
          s = re.sub(r'Hobo(?:Hobo)+State', 'HoboState', s)
          s = s.replace('enum class State : uint8_t', 'enum class HoboState : uint8_t')
          s = s.replace('CandidateInfo inspectAdvertisement(const NimBLEAdvertisedDevice *device)',
                        'CandidateInfo inspectAdvertisement(NimBLEAdvertisedDevice *device)')
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit normalized source
        run: |
          git config user.name "canyoncountryadventure"
          git config user.email "canyoncountryadventure@gmail.com"
          git add src/modules/HoboBleSensorModule.cpp
          git diff --cached --quiet && exit 0
          git commit -m "Normalize Heltec HOBO state enum references"
          git push origin HEAD:cca-heltec-sensor-gateway
