name: Build CCA Heltec Sensor Gateway

on:
  workflow_dispatch:
  push:
    branches:
      - cca-heltec-sensor-gateway
    paths:
      - 'src/**'
      - 'variants/**'
      - 'arch/**'
      - 'platformio.ini'
      - '.github/workflows/build_cca_heltec_gateway.yml'
      - '.github/workflows/build_firmware.yml'

permissions: read-all

jobs:
  build-heltec-v4:
    uses: ./.github/workflows/build_firmware.yml
    secrets: inherit
    with:
      version: cca-${{ github.run_number }}
      pio_env: heltec-v4
      platform: esp32s3

# Canonical Heltec V4 OLED build. Triggered after shared WiFi/BLE coexistence fix.
