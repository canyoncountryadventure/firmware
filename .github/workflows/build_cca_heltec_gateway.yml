name: Build Heltec Gateway v4

on:
  workflow_dispatch:
  push:
    branches:
      - Heltec-Gateway-v4
    paths:
      - 'src/**'
      - 'variants/**'
      - 'arch/**'
      - 'platformio.ini'
      - '.github/workflows/build_cca_heltec_gateway.yml'
      - '.github/workflows/build_firmware.yml'

permissions: read-all

jobs:
  build-heltec-v4:
    uses: ./.github/workflows/build_firmware.yml
    secrets: inherit
    with:
      version: cca-v4-${{ github.run_number }}
      pio_env: heltec-v4
      platform: esp32s3

  publish-latest:
    needs: build-heltec-v4
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - name: Download Heltec firmware artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: firmware-esp32s3-heltec-v4-cca-v4-*
          path: heltec-firmware
          merge-multiple: true

      - name: Package latest Heltec build
        shell: bash
        run: |
          set -euo pipefail
          test -n "$(find heltec-firmware -type f -print -quit)"
          zip -j -r Heltec-Gateway-v4.zip heltec-firmware/*
          {
            echo "TARGET=Heltec-Gateway-v4"
            echo "HARDWARE=Heltec WiFi LoRa 32 V4 OLED"
            echo "ENV=heltec-v4"
            echo "PLATFORM=esp32s3"
            echo "COMMIT=$GITHUB_SHA"
            sha256sum Heltec-Gateway-v4.zip
          } > Heltec-Gateway-v4-BUILD.txt

      - name: Checkout firmware download branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: field-self-recovery
          path: publish
          fetch-depth: 0

      - name: Publish permanent Heltec download
        shell: bash
        run: |
          set -euo pipefail
          cd publish
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3 4 5; do
            git fetch origin field-self-recovery
            git reset --hard origin/field-self-recovery
            mkdir -p downloads
            cp ../Heltec-Gateway-v4.zip downloads/
            cp ../Heltec-Gateway-v4-BUILD.txt downloads/
            git add downloads/Heltec-Gateway-v4.zip downloads/Heltec-Gateway-v4-BUILD.txt
            if git diff --cached --quiet; then
              echo "Download already current"
              exit 0
            fi
            git commit -m "Publish Heltec Gateway v2 download"
            if git push origin HEAD:field-self-recovery; then
              exit 0
            fi
            sleep $((attempt * 3))
          done
          echo "Failed to publish Heltec download after retries" >&2
          exit 1

# Heltec V4 gateway: mesh telemetry forwarding, Wi-Fi/cloud ingest, and shared SX1262 v2 recovery.
