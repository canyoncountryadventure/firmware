name: Build Heltec Gateway V13 Cloudflare Remote (dated release)
on:
  workflow_dispatch:
  push:
    branches: [Heltec-Gateway-v13]
    paths:
      - 'src/**'
      - 'variants/**'
      - 'arch/**'
      - 'platformio.ini'
      - 'README.md'
      - 'test/test_heltec_v5/**'
      - 'test/test_heltec_v6/**'
      - 'test/test_heltec_v9/**'
      - 'test/test_heltec_v7/**'
      - '.github/workflows/build_cca_heltec_gateway_v13.yml'
      - 'test/test_heltec_v13/**'
      - 'cloudflare/cces-mesh-remote/**'
      - 'tools/cca_remote_ota/**'
      - '.github/workflows/build_firmware.yml'
concurrency:
  group: heltec-gateway-v13-final-release
  cancel-in-progress: true
permissions: read-all
jobs:
  gateway-compat-tests:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - run: python3 test/test_heltec_v5/test_wire_compat.py
      - name: Test CC01 DM reply parsers
        run: |
          g++ -std=c++17 -Wall -Wextra -Werror -I. test/test_heltec_v6/test_dm_parser.cpp -o /tmp/test_cc01_dm
          /tmp/test_cc01_dm
      - name: Verify V9 missed-auto integration (replaces obsolete V7 periodic-poller replay)
        run: python3 test/test_heltec_v9/test_gateway_integration.py
      - name: Exercise V9 watchdog progress and failure logic
        run: |
          g++ -std=c++17 -Wall -Wextra -Werror -I. test/test_heltec_v7/test_recovery_supervisor.cpp -o /tmp/test_gateway_recovery_v7
          /tmp/test_gateway_recovery_v7
      - name: Verify Mill Creek telemetry allowlist
        run: python3 test/test_heltec_v9/test_mill_creek_allowlist.py
      - name: Test V9 per-sensor missing-auto fallback and MX220x replies
        run: |
          g++ -std=c++17 -Wall -Wextra -Werror -I. test/test_heltec_v9/test_auto_fallback.cpp -o /tmp/test_gateway_v9
          /tmp/test_gateway_v9
      - name: Validate V13 dual-ingest isolation and remote management code
        run: python3 test/test_heltec_v10/test_cloud_remote.py
      - name: Verify Cloudflare KV OTA support and loader safeguards
        run: python3 test/test_heltec_v13/test_cloudflare_kv.py
      - name: Test unsolicited manual sensor READ replies
        run: python3 test/test_heltec_v8/test_manual_dm_reply.py
      - name: Test TLS memory capture, cleanup and authenticated reporting
        run: |
          g++ -std=c++17 -Wall -Wextra -Werror -fsanitize=address,undefined -Itest/test_heltec_v13/tls_stubs -I. src/modules/CcaTlsMemory.cpp test/test_heltec_v13/test_tls_memory.cpp -o /tmp/test_tls_memory
          /tmp/test_tls_memory > /tmp/tls-memory-report.json
          node test/test_heltec_v13/test_tls_memory_worker.mjs /tmp/tls-memory-report.json
      - name: Test shared transport retry pacing and backend isolation
        run: |
          g++ -std=c++17 -Wall -Wextra -Werror -I. test/test_heltec_v13/test_tls_retry_gate.cpp -o /tmp/test_tls_retry_gate
          /tmp/test_tls_retry_gate
          python3 test/test_heltec_v13/test_tls_allocator_integration.py
      - name: Test packet-safe diagnostic replies
        run: |
          g++ -std=c++17 -Wall -Wextra -Werror -fsanitize=address,undefined -I. test/test_heltec_v13/test_diagnostic_text.cpp -o /tmp/test_diagnostic_text
          /tmp/test_diagnostic_text
      - name: Test V13 recent-progress and network-only recovery contracts
        run: |
          g++ -std=c++17 -Wall -Wextra -Werror -I. test/test_heltec_v13/test_recovery_supervisor.cpp -o /tmp/test_v13_recovery
          /tmp/test_v13_recovery
          python3 test/test_heltec_v13/test_network_recovery.py
          g++ -std=c++17 -Wall -Wextra -Werror -I. test/test_heltec_v13/test_network_backstop.cpp -o /tmp/test_v13_backstop
          /tmp/test_v13_backstop
          g++ -std=c++17 -Wall -Wextra -Werror -I. test/test_heltec_v13/test_reboot_dm.cpp -o /tmp/test_v13_reboot_dm
          /tmp/test_v13_reboot_dm
          python3 test/test_heltec_v13/test_reboot_dm_integration.py
  build-heltec-v13:
    uses: ./.github/workflows/build_firmware.yml
    secrets: inherit
    with:
      version: cca-heltec-v13-cloud-${{ github.run_number }}
      pio_env: heltec-v4
      platform: esp32s3

  publish-v13:
    needs: [build-heltec-v13, gateway-compat-tests]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
      actions: read
    steps:
      - name: Download exact Heltec V13 output
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: firmware-esp32s3-heltec-v4-cca-heltec-v13-cloud-*
          path: heltec-firmware
          merge-multiple: true
      - name: Prepare dated firmware and checksum metadata
        shell: bash
        run: |
          set -euo pipefail
          date_stamp="$(TZ=America/Denver date +%m-%d-%y)"
          date_stamp="$date_stamp-r${GITHUB_RUN_NUMBER}"
          echo "DATE_STAMP=$date_stamp" >> "$GITHUB_ENV"
          src="$(find heltec-firmware -maxdepth 1 -name 'firmware-heltec-v4-*.bin' ! -name '*.factory.bin' -print -quit)"
          test -n "$src"
          mkdir -p release-pack
          cp "$src" "release-pack/Heltec-Gateway-v13-$date_stamp.bin"
          (cd heltec-firmware && zip -q -r "../release-pack/Heltec-Gateway-v13-$date_stamp.zip" .)
          {
            echo "TARGET=Heltec-Gateway-v13"
            echo "HARDWARE=Heltec WiFi LoRa 32 V4 OLED"
            echo "PIO_ENV=heltec-v4"
            echo "FORMAT=ESP32-S3 BIN; ZIP includes companion OTA/flash files"
            echo "SOURCE_COMMIT=$GITHUB_SHA"
            echo "BUILD_RUN=https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            (cd release-pack && sha256sum *.bin *.zip)
          } > release-pack/BUILD.txt
      - name: Publish only verified current source
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 --branch Heltec-Gateway-v13 "https://x-access-token:${{ github.token }}@github.com/$GITHUB_REPOSITORY.git" publish
          cd publish
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          latest="$(git rev-parse HEAD)"
          if [[ "$latest" != "$GITHUB_SHA" ]]; then
            echo "::error::Source branch advanced. Refusing stale Heltec release."
            exit 1
          fi
          mkdir -p downloads/Heltec-Gateway-v13
          cp ../release-pack/* downloads/Heltec-Gateway-v13/
          python3 - <<'PYDOC'
          import os
          from pathlib import Path
          folder = Path("downloads/Heltec-Gateway-v13")
          stem = "Heltec-Gateway-v13-" + os.environ["DATE_STAMP"]
          prefix = "https://github.com/" + os.environ["GITHUB_REPOSITORY"] + "/raw/refs/heads/Heltec-Gateway-v13/"
          for page in [Path("README.md"), folder / "README.md"]:
              lines = page.read_text().splitlines()
              for label, ext in [("application-bin", ".bin"), ("companion-zip", ".zip")]:
                  artifact = folder / (stem + ext)
                  assert artifact.is_file()
                  index, = [i for i, line in enumerate(lines) if line.startswith(f"[{label}]: ")]
                  lines[index] = f"[{label}]: {prefix}{artifact}"
              page.write_text("\n".join(lines) + "\n")
          PYDOC
          git add README.md downloads/Heltec-Gateway-v13
          git commit -m "Publish Heltec V13 gateway image $DATE_STAMP [skip ci]"
          git push origin HEAD:Heltec-Gateway-v13
