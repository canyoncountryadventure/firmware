name: Build Trail PIR Rock HOBO V3
on:
  push:
    branches:
      - Trail-Sensors-v3
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: trail-pir-rock-hobo-v3
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout V3 trail sensors
        uses: actions/checkout@v7
        with:
          ref: Trail-Sensors-v3
          submodules: recursive
      - name: Build Seeed PIR Rock HOBO target
        uses: meshtastic/gh-action-firmware@39d0ffe8e0708beb3fb7b66f4c91aa941dc9764e
        with:
          pio_platform: nrf52840
          pio_env: seeed_xiao_nrf52840_cca_mx_pir
          pio_target: build
      - name: Prepare V3 PIR Rock HOBO target downloads
        shell: bash
        run: |
          set -euo pipefail
          UF2="$(find release -maxdepth 1 -type f -name 'firmware-seeed_xiao_nrf52840_cca_mx_pir-*.uf2' | sort | head -n 1)"
          OTA="$(find release -maxdepth 1 -type f -name 'firmware-seeed_xiao_nrf52840_cca_mx_pir-*-ota.zip' | sort | head -n 1)"
          test -n "$UF2" && test -f "$UF2"
          test -n "$OTA" && test -f "$OTA"
          mkdir -p export
          cp "$UF2" export/Trail-PIR-Rock-HOBO-v3.uf2
          cp "$OTA" export/Trail-PIR-Rock-HOBO-v3-OTA.zip
          {
            echo "TARGET=Trail-PIR-Rock-HOBO-v3"
            echo "COMMIT=$GITHUB_SHA"
            echo "HOBO_STATUS_POLL=30sec"
            sha256sum export/Trail-PIR-Rock-HOBO-v3.uf2 export/Trail-PIR-Rock-HOBO-v3-OTA.zip
          } > export/Trail-PIR-Rock-HOBO-v3-BUILD.txt
      - name: Upload V3 trail target artifact
        uses: actions/upload-artifact@v7
        with:
          name: Trail-PIR-Rock-HOBO-v3-${{ github.run_number }}
          retention-days: 30
          overwrite: true
          path: export/*
      - name: Checkout durable target catalog
        uses: actions/checkout@v7
        with:
          ref: field-self-recovery
          path: publish
          fetch-depth: 0
      - name: Publish V3 trail files
        shell: bash
        run: |
          set -euo pipefail
          cd publish
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          latest="$(git ls-remote origin refs/heads/Trail-Sensors-v3 | awk '{print $1}')"
          if [[ "$latest" != "$GITHUB_SHA" ]]; then
            echo "Skip stale Trail V3"
            exit 0
          fi
          for attempt in 1 2 3 4 5; do
            git fetch origin field-self-recovery
            git reset --hard origin/field-self-recovery
            mkdir -p downloads
            cp ../export/* downloads/
            git add downloads/Trail-PIR-Rock-HOBO-v3*
            if git diff --cached --quiet; then exit 0; fi
            git commit -m "Publish Trail PIR Rock HOBO V3"
            if git push origin HEAD:field-self-recovery; then exit 0; fi
            sleep $((attempt * 3))
          done
          exit 1
