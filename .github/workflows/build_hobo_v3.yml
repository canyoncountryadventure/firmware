name: Build Seeed-HOBO-Safe-v3
on:
  push:
    branches:
      - Seeed-HOBO-Safe-v3
  workflow_dispatch:

concurrency:
  group: Seeed-HOBO-Safe-v3-build
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout this V3 target branch
        uses: actions/checkout@v7
        with:
          ref: Seeed-HOBO-Safe-v3
          submodules: recursive

      - name: Build seeed_xiao_nrf52840_kit target
        uses: meshtastic/gh-action-firmware@39d0ffe8e0708beb3fb7b66f4c91aa941dc9764e
        with:
          pio_platform: nrf52840
          pio_env: seeed_xiao_nrf52840_kit
          pio_target: build

      - name: Prepare ordinary USB UF2 and BLE OTA ZIP
        shell: bash
        run: |
          set -euo pipefail
          UF2="$(find release -maxdepth 1 -type f -name 'firmware-seeed_xiao_nrf52840_kit-*.uf2' | sort | head -n 1)"
          OTA="$(find release -maxdepth 1 -type f -name 'firmware-seeed_xiao_nrf52840_kit-*-ota.zip' | sort | head -n 1)"
          test -n "$UF2" && test -f "$UF2"
          test -n "$OTA" && test -f "$OTA"
          mkdir -p export
          cp "$UF2" export/Seeed-HOBO-Safe-v3.uf2
          cp "$OTA" export/Seeed-HOBO-Safe-v3-OTA.zip
          {
            echo "TARGET=Seeed-HOBO-Safe-v3"
            echo "ENV=seeed_xiao_nrf52840_kit"
            echo "COMMIT=$GITHUB_SHA"
            echo "HOBO_STATUS_POLL=30sec"
            echo "DRONE_IMAGE=Build separately on Remote-Drone-Flashing-v2"
            sha256sum export/Seeed-HOBO-Safe-v3.uf2 export/Seeed-HOBO-Safe-v3-OTA.zip
          } > export/Seeed-HOBO-Safe-v3-BUILD.txt

      - name: Upload V3 target artifacts
        uses: actions/upload-artifact@v7
        with:
          name: Seeed-HOBO-Safe-v3-${{ github.run_number }}
          retention-days: 30
          overwrite: true
          path: export/*

      - name: Checkout durable download catalog
        uses: actions/checkout@v7
        with:
          ref: field-self-recovery
          path: publish
          fetch-depth: 0

      - name: Publish V3 target downloads without overwriting V2
        shell: bash
        run: |
          set -euo pipefail
          cd publish
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          latest="$(git ls-remote origin refs/heads/Seeed-HOBO-Safe-v3 | awk '{print $1}')"
          if [[ "$latest" != "$GITHUB_SHA" ]]; then
            echo "Skip stale V3 output $GITHUB_SHA (now $latest)"
            exit 0
          fi
          for attempt in 1 2 3 4 5; do
            git fetch origin field-self-recovery
            git reset --hard origin/field-self-recovery
            mkdir -p downloads
            cp ../export/Seeed-HOBO-Safe-v3.uf2 downloads/
            cp ../export/Seeed-HOBO-Safe-v3-OTA.zip downloads/
            cp ../export/Seeed-HOBO-Safe-v3-BUILD.txt downloads/
            git add downloads/Seeed-HOBO-Safe-v3.uf2 downloads/Seeed-HOBO-Safe-v3-OTA.zip downloads/Seeed-HOBO-Safe-v3-BUILD.txt
            if git diff --cached --quiet; then
              echo "V3 target downloads already current"
              exit 0
            fi
            git commit -m "Publish Seeed-HOBO-Safe-v3 target UF2 and OTA ZIP"
            if git push origin HEAD:field-self-recovery; then exit 0; fi
            sleep $((attempt * 3))
          done
          echo "V3 target publish failed after retry limit" >&2
          exit 1
